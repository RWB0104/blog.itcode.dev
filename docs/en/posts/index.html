, which lets you build a CI\/CD pipeline at no extra cost."],"tags":["GitHub","GitHub Actions","Events","YAML","crontab"],"title":"[GitHub Actions] Rest in Peace, Manual Deployment — GitHub Actions Has Arrived - 3. How to Run GitHub Actions. Events","type":"posts"},"url":"\/2023\/10\/29\/github-actions-3"},{"body":"","meta":{"category":"GitHub","createdAt":1698250814682,"group":"Rest in Peace, Manual Deployment — GitHub Actions Has Arrived","hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/094a4fa5-f336-4c54-9df3-b5791d48de21"],"subtitle":["In the previous post, we confirmed what CI\/CD is, and that GitHub Actions is one of the representative services that provides it. So how exactly does GitHub Actions provide CI\/CD service? Let's learn about GitHub Actions."],"tags":["GitHub","GitHub Actions","Workflows","Events","Jobs","Runners","Steps","YAML"],"title":"[GitHub Actions] Rest in Peace, Manual Deployment — GitHub Actions Has Arrived - 2. Learning About GitHub Actions","type":"posts"},"url":"\/2023\/10\/26\/github-actions-2"},{"body":"","meta":{"category":"WEB","createdAt":1696514930000,"hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/c2f5730a-8f58-4c18-b818-5dd64a431b98"],"subtitle":["If you look at post-centric sites, most of them offer a feature that shows popular posts based on view counts. Each post's view count is stored, and based on that, posts with the highest views or that meet certain criteria are shown. But my blog doesn't store view counts at all. That's because it's serverless. It only performs static hosting via GitHub, and the structure can't expect any computation beyond that on the server. So there's no way to actively count visitors."],"tags":["GA","Google Analytics"],"title":"A Roundabout Way to Show a Blog's Popular Posts Using the Google Analytics API","type":"posts"},"url":"\/2023\/10\/05\/hot-posts-with-ga4"},{"body":"","meta":{"category":"GitHub","createdAt":1695840894000,"group":"Rest in Peace, Manual Deployment — GitHub Actions Has Arrived","hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/094a4fa5-f336-4c54-9df3-b5791d48de21"],"subtitle":["A single piece of software goes through many stages before it's finished. Depending on the scale of the program, it requires more manpower, more processes, and more scheduling. But regardless of the program, the result always comes down to one thing: build and deployment. Mere text and assets are turned into a single program through the build process, and made usable to people through deployment. That's the goal of every program. Accordingly, the importance of build and deployment is also very significant. And in line with that, build\/deploy is never an easy task. The larger a program gets, the more time it takes, and then some."],"tags":["GitHub","GitHub Actions","CI","CD","Continuous Integration","Continuous Delivery","Continuous Deployment"],"title":"[GitHub Actions] Rest in Peace, Manual Deployment — GitHub Actions Has Arrived - 1. CI\/CD","type":"posts"},"url":"\/2023\/09\/28\/github-actions-1"},{"body":"","meta":{"category":"TypeScript","createdAt":1695660780000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/270418234-c6951309-6bad-4e82-82a8-244585f54735.jpg"],"subtitle":["One element of writing is the concept of a table of contents, also called a TOC (Table Of Content). Through a TOC, readers can grasp the overall content and structure of a piece of writing, and if they want, they can be guided to selectively pick just the parts they need. It's a useful device both for readers and for the writing itself."],"tags":["React","TypeScript","Markdown","Regexp","Table Of Content"],"title":"[TypeScript] Building a Markdown TOC","type":"posts"},"url":"\/2023\/09\/26\/markdown-toc"},{"body":"","meta":{"category":"React","createdAt":1695469287000,"hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/31f064a8-fa78-4a6d-94fe-b0c23a14ce7a"],"subtitle":["When working on a React project, chances are you're going to end up using `Next.js`. I recently revamped my blog and ran `create-next-app`, and it seems there are some notable changes now that it's been updated to version 13. Some of these changes differ quite a bit from the previous usage, which gave me a bit of trouble, so I wanted to cover these changes in this post."],"tags":["React","Web","Next.js"],"title":"[Next.js] Exploring Next.js 13","type":"posts"},"url":"\/2023\/09\/23\/nextjs13"},{"body":"","meta":{"category":"React","createdAt":1675443391000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/216662084-69f29d33-1956-42a1-90d6-80d311949d10.png"],"subtitle":["React and state management are inseparable. There have been many attempts to make state management more efficient and smarter, and recoil is one of them. Unlike its predecessors Redux and mobx, recoil is loved by many for being simple yet powerful. I'm also a fan of it when developing with React."],"tags":["React","Web","recoil"],"title":"[recoil] Resolving the Duplicate atom key Error","type":"posts"},"url":"\/2023\/02\/04\/recoil-duplicated-key"},{"body":"","meta":{"category":"Thoughts","createdAt":1658765199000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/180824351-714b4d97-f27e-482f-b1c6-2e45f67ab816.png"],"subtitle":["Off to Jeju Island~~~~~~"],"tags":["Tesla"],"title":"A bored write-up: My Tesla Model 3 Rental Review","type":"posts"},"url":"\/2022\/07\/25\/tesla-model3"},{"body":"","meta":{"category":"WEB","createdAt":1655043065000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/174484667-7e302426-0c49-44e1-ab1e-d3c22b876ec3.png"],"subtitle":["As internet history continues and development advances, the web, the internet's flagship medium, keeps growing larger as well. In its early days, the web only showed simple pages based on static data, but now it handles large-scale business logic without difficulty. Following this trend, the weight carried by pages, the web's basic unit, keeps growing as well. We enjoy dozens of pages every day. Users simply engage in the activity of \"viewing a page,\" but as with everything, there are many hidden operations behind the scenes. Among them, much thought goes into the logic for rendering — that is, drawing — a page in order to show it to the user. Showing a page faster and more efficiently leads to a better page UX."],"tags":["CSR","SSR","SSG"],"title":"The Three Rendering Siblings: CSR, SSR, SSG","type":"posts"},"url":"\/2022\/06\/12\/csr-ssr-ssg"},{"body":"","meta":{"category":"WAS","createdAt":1644661241000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/168463019-ff20eb0d-7fa5-4866-9086-77b1df7a4a78.png"],"subtitle":["I've been building an API server using the Jersey 3 library. Even after writing the code and calling the correct URL, I kept getting a 404 error. I wrote a simple test servlet and compared it against the official documentation over and over, but couldn't find anything unusual. It turned out that Jersey 3 supports Servlet 5.0, and Servlet 5.0 spec can only run on Tomcat 10 or higher, which implements that spec — something I hadn't known until then. I never paid much attention to the Tomcat version before, but this made me realize there's a big difference between Tomcat 9 and Tomcat 10."],"tags":["JAVA","WAS","Tomcat"],"title":"Tomcat 9 vs 10","type":"posts"},"url":"\/2022\/02\/12\/tomcat-9-and-10"},{"body":"","meta":{"category":"Algorithm","createdAt":1640783592000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430 ers-a0069"},{"body":"","meta":{"category":"Algorithm","createdAt":1640524178000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["In the fall, the Kakao Friends went on a group outing. After having a great time, they lined up in a row in front of the camera to take a group photo at the end. However, since everyone wanted a different arrangement, it took a long time to decide the order to stand in. Neo wanted to stand next to Prodo, and Ryan, who had once been hit by fire breathed by Tube, wanted to stand at least three spots away from Tube. On the way back after taking the picture, Muzi got to wondering whether there might have been other ways to stand that also satisfied everyone's conditions. Let's write a program that computes the number of ways everyone can stand in a row that satisfies each Friend's desired conditions, given those conditions as input."],"tags":["Programmers","Algorithm","JAVA","Level 2"],"title":"[Programmers \/ JAVA] Level 2 Group Photo (1835)","type":"posts"},"url":"\/2021\/12\/26\/programmers-a0068"},{"body":"","meta":{"category":"Algorithm","createdAt":1640504051000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["Apeach, an editor at a publishing house, asked Neo to draw original artwork for a coloring book and received several pictures. Wanting to arrange the pictures in the coloring book in order of difficulty, Apeach discovered that having more regions makes coloring more tricky and difficult, and so defined the difficulty of a picture as the number of regions. (A region refers to a space of the same color connected up, down, left, and right.) Let's write a program that calculates how many regions are in a picture and how large the largest region is."],"tags":["Programmers","Algorithm","JAVA","Level 2"],"title":"[Programmers \/ JAVA] Level 2 Kakao Friends Coloring Book (1829)","type":"posts"},"url":"\/2021\/12\/26\/programmers-a0067"},{"body":"","meta":{"category":"Algorithm","createdAt":1640504051000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["In KakaoTalk's open chat rooms, you can chat with people who aren't your friends, entering the chat room using a virtual nickname instead of your real one. Kim Crew, a new employee, decided to build an admin screen for the person who created a KakaoTalk open chat room, so they can watch various people enter and leave. When someone enters the chat room, the following message is displayed."],"tags":["Programmers","Algorithm","JAVA","Level 2"],"title":"[Programmers \/ JAVA] Level 2 Open Chat Room (42888)","type":"posts"},"url":"\/2021\/12\/26\/programmers-a0066"},{"body":"","meta":{"category":"Algorithm","createdAt":1640453878000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["\"Apeach,\" who wants to become a data processing expert, is studying methods for compressing strings. She's recently been studying a simple lossless compression method for processing large amounts of data, which represents consecutive occurrences of the same value in a string using the count of the character and the repeated value, expressing it as a shorter string. As a simple example, \"aabbaccc\" can be represented as \"2a2ba3c\" (when a character appears only once with no repetition, the 1 is omitted), but this method has the downside that the compression ratio is low when there are few repeated characters. For example, a string like \"abcabcdede\" isn't compressed at all. To address this drawback, \"Apeach\" is trying to find a way to split the string into units of 1 or more characters before compressing it, so it can be represented as a shorter string."],"tags":["Programmers","Algorithm","JAVA","Level 2"],"title":"[Programmers \/ JAVA] Level 2 String Compression (60057)","type":"posts"},"url":"\/2021\/12\/26\/programmers-a0065"},{"body":"","meta":{"category":"Algorithm","createdAt":1639898311000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["This problem gives you two integers n and m via standard input. Using the star (*) character, print out a rectangle with a width of n and a height of m."],"tags":["Programmers","Algorithm","JAVA","Level 1"],"title":"[Programmers \/ JAVA] Level 1 Drawing a Rectangle with Stars (12954)","type":"posts"},"url":"\/2021\/12\/19\/programmers-a0064"},{"body":"","meta":{"category":"Algorithm","createdAt":1639832189000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["The function solution receives an integer x and a natural number n, and must return a list containing n numbers starting from x and increasing by x each time. Look at the following constraints and complete the function solution that satisfies the conditions."],"tags":["Programmers","Algorithm","JAVA","Level 1"],"title":"[Programmers \/ JAVA] Level 1 N Numbers Spaced by x (12954)","type":"posts"},"url":"\/2021\/12\/18\/programmers-a0063"},{"body":"","meta":{"category":"Algorithm","createdAt":1639832189000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["Matrix addition takes two matrices of equal number of rows and columns, and produces a result by adding the values at the same
