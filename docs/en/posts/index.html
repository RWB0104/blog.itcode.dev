ue,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["Each key on a smartphone's phone keypad has a number written on it as follows. On this phone keypad, you're going to enter only digits using just the thumbs of your left and right hands. The left thumb starts at the `*` key and the right thumb starts at the `#` key, and the rules for using the thumbs are as follows."],"tags":["Programmers","Algorithm","JAVA","Level 1"],"title":"[Programmers \/ JAVA] Level 1 Pressing the Keypad (67256)","type":"posts"},"url":"\/2021\/12\/14\/programmers-a0004"},{"body":"","meta":{"category":"Algorithm","createdAt":1639448464000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["Neo and Frodo are playing a number game. When Neo hands Frodo a card with a number where some digits have been replaced with English words, Frodo has to figure out the original number. Below is an example of replacing some digits of a number with English words."],"tags":["Programmers","Algorithm","JAVA","Level 1"],"title":"[Programmers \/ JAVA] Level 1 Numeric String and English Words (81301)","type":"posts"},"url":"\/2021\/12\/14\/programmers-a0003"},{"body":"","meta":{"category":"Algorithm","createdAt":1639440688000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["Neo, a new developer who joined Kakao, was assigned to the \"Kakao Account Development Team\" and put in charge of generating IDs for users signing up for Kakao services. Neo's first task was to develop a program that, when a newly signing-up user enters an ID that doesn't meet Kakao's ID rules, recommends a new ID that's similar to the entered ID but follows the rules. Below are the rules for a Kakao ID."],"tags":["Programmers","Algorithm","JAVA","Level 1"],"title":"[Programmers \/ JAVA] Level 1 New ID Recommendation (72410)","type":"posts"},"url":"\/2021\/12\/14\/programmers-a0002"},{"body":"","meta":{"category":"Algorithm","createdAt":1639440614000,"group":"Programmers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/145976356-6b5d1430-31c0-4c34-829e-6be8f747ab19.png"],"subtitle":["Lotto 6\/45 (hereafter 'Lotto') is a well-known lottery in which you pick 6 numbers out of 1 to 45 and try to match them. Below is how Lotto rankings are determined. Minwoo, who bought a Lotto ticket, was eagerly awaiting the day the winning numbers would be announced. However, Minwoo's younger sibling scribbled on the ticket, making some of the numbers unreadable. After the winning numbers were announced, Minwoo wanted to figure out the best and worst possible ranks his ticket could have won."],"tags":["Programmers","Algorithm","JAVA","Level 1"],"title":"[Programmers \/ JAVA] Level 1 Best and Worst Lotto Rank (77484)","type":"posts"},"url":"\/2021\/12\/14\/programmers-a0001"},{"body":"","meta":{"category":"NextJS","createdAt":1636287237000,"group":"Blog Overhaul Journey","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/134931033-89954c3d-5e00-4b3b-85aa-54a1dfa29e46.png"],"subtitle":["In the previous chapter, I implemented this blog's own Markdown converter using marked. Let's use this converter to make the plain code blocks look a bit more like an IDE."],"tags":["NextJS","React","Markdown","HTML","SCSS","TypeScript"],"title":"[NextJS] Blog Overhaul Journey - 5. Improving Code Block Design Using marked","type":"posts"},"url":"\/2021\/11\/07\/nextjs-reorganization-5"},{"body":"","meta":{"category":"NextJS","createdAt":1635399406000,"group":"Blog Overhaul Journey","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/134931033-89954c3d-5e00-4b3b-85aa-54a1dfa29e46.png"],"subtitle":["Static blogs make heavy use of Markdown, because it's very familiar as a plain-text format while also having excellent compatibility with HTML. My previous blog used the Remark and Rehype plugins. With various plugins available, they were quite convenient for basic use, but it was very difficult for a user to customize the conversion process directly. I wanted to add extra functionality and styling to TOCs, code blocks, and links by attaching HTML tags, but since there was no relevant API, I had no choice but to use whatever tags were given as-is. While researching this, the marked plugin seemed to satisfy what I wanted, so during the blog overhaul I made many changes to the Markdown plugin as well. This chapter covers the process of converting Markdown to HTML using marked."],"tags":["NextJS","React","Markdown"],"title":"[NextJS] Blog Overhaul Journey - 4. Implementing a Markdown Converter Using marked","type":"posts"},"url":"\/2021\/10\/28\/nextjs-reorganization-4"},{"body":"","meta":{"category":"JAVA","createdAt":1635088378000,"group":"Building an OAuth2.0 Authentication Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["This chapter covers how to provide RESTful API services using Jersey. Since this project receives and responds to requests through Jersey, we'll briefly cover Jersey before setting up the controllers. Typically, the Spring framework is widely used to build JAVA servers. Still, the reason I chose Jersey instead is, first of all, that I don't know Spring very well. But beyond that, compared to Spring, it's smaller in scale and simpler to configure, letting me focus entirely on building a RESTful server. Not to mention how vicious Spring's configuration can be, this project doesn't require complex logic or a wide variety of features by its nature. Since we wouldn't be using Spring's vast scale to its full extent, the tail would be wagging the dog."],"tags":["JAVA","OAuth2.0","Jersey"],"title":"[OAuth2.0] Building an OAuth2.0 Authentication Server with ScribeJAVA - 9. Providing RESTful API Services with Jersey","type":"posts"},"url":"\/2021\/10\/25\/oauth2-java-server-9"},{"body":"","meta":{"category":"JAVA","createdAt":1635169281000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["I've made a lot of things over time, but I never really got around to organizing and documenting them. I wasn't really using GitHub, and I wasn't really running a blog either... And now I've bought a personal server too. This was a project I built as a trial run for my own development portfolio. I think this is the first project I've written up step by step, from development all the way through to wrapping it up."],"tags":["JAVA","OAuth2.0"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 12. Closing Thoughts","type":"posts"},"url":"\/2021\/10\/25\/oauth2-java-server-12"},{"body":"","meta":{"category":"JAVA","createdAt":1635169281000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["We registered the OAuth service and even built the authorization server separately, but that doesn't mean it's immediately usable. In this chapter, we apply for OAuth service review so the OAuth service can be used fully."],"tags":["JAVA","OAuth2.0"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 11. Applying for OAuth Service Review","type":"posts"},"url":"\/2021\/10\/25\/oauth2-java-server-11"},{"body":"","meta":{"category":"JAVA","createdAt":1635096257000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["Let's set up the controllers that receive requests and return responses using the Jersey library. If you want to learn more about Jersey, check out the previous post."],"tags":["JAVA","OAuth2.0","Jersey"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 10. Implementing the Controllers","type":"posts"},"url":"\/2021\/10\/25\/oauth2-java-server-10"},{"body":"","meta":{"category":"JAVA","createdAt":1635087490000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["From chapter 4 through chapter 7, we implemented the authentication module for each platform. In this chapter, we implement the processes, the layer that uses these modules. Processes are organized and managed by HTTP method."],"tags":["JAVA","OAuth2.0"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 8. Implementing the Processes","type":"posts"},"url":"\/2021\/10\/24\/oauth2-java-server-8"},{"body":"","meta":{"category":"JAVA","createdAt":1634933326000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["As the last platform, let's apply for an OAuth service with GitHub and implement the authentication module."],"tags":["JAVA","OAuth2.0","scribeJAVA"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 7. Applying for the GitHub OAuth Service and Implementing the Module","type":"posts"},"url":"\/2021\/10\/23\/oauth2-java-server-7"},{"body":"","meta":{"category":"JAVA","createdAt":1634928664000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["As the third platform, let's apply for an OAuth service with KAKAO and implement the authentication module."],"tags":["JAVA","OAuth2.0","scribeJAVA"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 6. Applying for the KAKAO OAuth Service and Implementing the Module","type":"posts"},"url":"\/2021\/10\/23\/oauth2-java-server-6"},{"body":"","meta":{"category":"JAVA","createdAt":1634921513000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["As the second platform, let's apply for an OAuth service with Google and implement the authentication module."],"tags":["JAVA","OAuth2.0","scribeJAVA"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 5. Applying for the Google OAuth Service and Implementing the Module","type":"posts"},"url":"\/2021\/10\/23\/oauth2-java-server-5"},{"body":"","meta":{"category":"JAVA","createdAt":1634909116000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["As the first platform, let's apply for an OAuth service with NAVER and implement the authentication module."],"tags":["JAVA","OAuth2.0","scribeJAVA"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 4. Applying for the NAVER OAuth Service and Implementing the Module","type":"posts"},"url":"\/2021\/10\/22\/oauth2-java-server-4"},{"body":"","meta":{"category":"JAVA","createdAt":1634660800000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["Let's implement an authentication module using the OAuth library scribeJAVA."],"tags":["JAVA","OAuth2.0","Jersey"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 3. Implementing the OAuth2.0 Authentication Module with scribeJAVA","type":"posts"},"url":"\/2021\/10\/20\/oauth2-java-server-3"},{"body":"","meta":{"category":"JAVA","createdAt":1634217145000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["Now that we've gained some background knowledge about the OAuth2.0 protocol, let's use it to build an authorization server ourselves. The ultimate goal is to build the whole system, split into Frontend and Backend parts, where social login is performed through the web page and processed by an authorization server we implement ourselves."],"tags":["JAVA","OAuth2.0"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 2. Designing the Authorization Server","type":"posts"},"url":"\/2021\/10\/14\/oauth2-java-server-2"},{"body":"","meta":{"category":"JAVA","createdAt":1634140591000,"group":"Building an OAuth2.0 Authorization Server","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/137171016-99af1db1-a346-4def-9329-6072b927bdc0.png"],"subtitle":["As you browse around the web, you'll frequently run into sites that require login. And most of these sites offer platform login options such as \"Log in with Naver.\" It's not just websites either — most apps released these days also provide authentication services through platforms. Using this, you can sign up or log in through a very simple process. This kind of service is offered not only by Naver but by most platforms of a certain size, such as Google and Kakao, in the form of a \"Log in with [Platform]\" feature. Using a platform's information to perform authentication on another site like this is called the OAuth protocol."],"tags":["JAVA","OAuth2.0"],"title":"[OAuth2.0] Building an OAuth2.0 Authorization Server with ScribeJAVA - 1. What is OAuth2.0?","type":"posts"},"url":"\/2021\/10\/14\/oauth2-java-server-1"},{"body":"","meta":{"category":"NextJS","createdAt":1632457044000,"group":"Blog Redesign Journey","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/134931033-89954c3d-5e00-4b3b-85aa-54a1dfa29e46.png"],"subtitle":["Originally, my blog used the JS-in-CSS styling approach. The reason was Material-UI. Since Material-UI's official examples explicitly explain things using the JS-in-CSS approach, I, being at a beginner level with React, naturally assumed this was how it had to be done. However, as development continued, some components were forced into complex styles, and components with bloated style syntax started to appear. As a result, the drawbacks of JS-in-CSS gradually became apparent. A representative problem is FOUC (Flash Of Unstyled Content) — a phenomenon where style rendering takes time, causing the user to see the page before rendering is complete. On my page, FOUC occurred for just under about a second, which severely hurt the user experience. This FOUC issue was also the biggest reason I decided to redesign my blog, and after researching related information, I confirmed that CSS-in-CSS performs significantly better."],"tags":["NextJS","React","SCSS","CSS"],"title":"[NextJS] Blog Redesign Journey - 3. Adding SCSS","type":"posts"},"url":"\/2021\/09\/24\/nextjs-reorganization-3"},{"body":"","meta":{"category":"NextJS","createdAt":1632169821000,"group":"Blog Reorganization Journal","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/134931033-89954c3d-5e00-4b3b-85aa-54a1dfa29e46.png"],"subtitle":["When I first encountered JavaScript and grew somewhat comfortable with its basic concepts, I heard a story that was passed around like a legend in the developer community."],"tags":["NextJS","React","TypeScript"],"title":"[NextJS] Blog Reorganization Journal - 2. Clothing It in TypeScript","type":"posts"},"url":"\/2021\/09\/21\/nextjs-reorganization-2"},{"body":"","meta":{"category":"NextJS","createdAt":1632162155000,"group":"Blog Reorganization Journal","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/134931033-89954c3d-5e00-4b3b-85aa-54a1dfa29e46.png"],"subtitle":["It was May when I picked up React through bits and pieces I found on the internet, and boldly, without really knowing what I was doing, started developing a blog. Back then, I was gripped by a strong desire to make something with this fun new tool, and the thing that caught my eye at the time was a dev blog. The blog I was using back then was a Jekyll-based GitHub blog, which I'd started because it looked fun, but gave up on within a few days — that was over a year ago. One of the reasons I lost interest in blogging was the stress of having to painstakingly analyze code someone else had written just to make small changes. The moment I saw a dev blog, this was roughly the train of thought running through my head."],"tags":["NextJS","React"],"title":"[NextJS] Blog Reorganization Journal - 1. Record One","type":"posts"},"url":"\/2021\/09\/21\/nextjs-reorganization-1"},{"body":"","meta":{"category":"Ubuntu","createdAt":1631638401000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/133300948-2ee9b77a-1589-4afc-8489-fb402a13520f.png"],"subtitle":["Remote protocols like SSH and SFTP improve a server's accessibility, but they severely undermine its security. If an attacker discovers a specific server's IP, they can attempt an SSH connection to that IP. Even without knowing the IP, they can just as easily get in through a domain linked to that IP, since a domain's information — including the IP and even ownership details — can easily be obtained by querying a DNS server. Therefore, if anyone knows the IP or domain, SSH service port, and account information of the server you're trying to access, they can attempt an SSH connection or cause damage to the server at will. The moment you expose a domain to the outside world, various connection attempts start coming in from both home and abroad. Attacks from China in particular come in a lot, and you can easily find related experiences and case studies of damage on the internet."],"tags":["Ubuntu","SSH","SFTP"],"title":"[Ubuntu] Strengthening the Security of Ubuntu Remote Protocols","type":"posts"},"url":"\/2021\/09\/15\/increase-ubuntu-remote-security"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1631552642000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["Finally, the last chapter of building the Raspberry Pi development environment. A DBMS is a system that manages a DB (Database), a storage space for holding various data. It lets you store necessary data in the DB and retrieve it as needed to work with it. By linking a web server with a DBMS, you can store and use user account information, settings, and more."],"tags":["Raspberry Pi","Ubuntu","MariaDB","RDBMS"],"title":"[Raspberry Pi 4] Setting Up MariaDB","type":"posts"},"url":"\/2021\/09\/14\/ubuntu-in-mariadb"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1631108438000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["Now the Raspberry Pi has a fairly presentable web server environment set up. But handling the Raspberry Pi by directly connecting a monitor, keyboard, and mouse to the device is a bit cumbersome. In this context, the Raspberry Pi is meant to operate as a secondary web server, so it can't be the main computer. In other words, most work such as development happens on the main computer, with the server only handling deployment. When devices are split this way, both devices need to be able to access each other smoothly. In short, we need a remote environment. In this chapter, we set up a remote environment on the Raspberry Pi. By setting up SSH and RDP communication, we configure it so the Raspberry Pi can be accessed from anywhere, whether via SSH or a Windows PC."],"tags":["Raspberry Pi","Ubuntu","SSH","RDP"],"title":"[Raspberry Pi 4] Setting Up a Remote Environment (SSH, RDP)","type":"posts"},"url":"\/2021\/09\/08\/raspberry-remote"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1630914640000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["In the previous chapter, I obtained a dev domain through Google Domains. This blog's address actually uses the domain I purchased, https:\/\/blog.itcode.dev. The dev domain has an enhanced security policy applied. All HTTP communication to that domain must be served exclusively via HTTPS secure communication. Since routing happens over the https protocol at the network layer, providing an HTTPS service is mandatory whether we like it or not."],"tags":["Raspberry Pi","Ubuntu","Tomcat","SSL"],"title":"[Raspberry Pi 4] Providing HTTPS Communication on an Ubuntu Server with Let's Encrypt","type":"posts"},"url":"\/2021\/09\/06\/raspberry-ssl-domain"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1630724944000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["Through the process so far, I've installed an OS on the Raspberry Pi and set up an environment where Tomcat runs as a web server. Now we can access the site by connecting to the Raspberry Pi's IP address. But a proper page isn't accessed by typing in an IP address. We'll acquire a domain, link it to the IP, and use it as the URL address. In this chapter, we purchase a domain directly and connect it to the Raspberry Pi server."],"tags":["Raspberry Pi","Ubuntu","Domain"],"title":"[Raspberry Pi 4] Applying a Domain to the Raspberry Pi","type":"posts"},"url":"\/2021\/09\/04\/raspberry-domain"},{"body":"","meta":{"category":"Ubuntu","createdAt":1630686380000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/132039520-3efc64ec-28c2-499c-af29-dfe153f53852.png"],"subtitle":["Every building has an entrance. In a normal situation, whoever wants to enter or leave a building must pass through the entrance, whether they like it or not. This entrance isn't always simply open, either — it may stay open when needed but be closed at certain times. Some places are even quite particular about who they let in. Think of a restricted security area, or a club on a Friday night. PC communication works on essentially the same principle. It may look like PCs just communicate freely, but each one comes and goes through an assigned entrance. If a PC is a building, then the PC's entrance can be called a port (PORT)."],"tags":["Ubuntu","Firewall"],"title":"[Ubuntu] Configuring Firewall Ports with ufw","type":"posts"},"url":"\/2021\/09\/04\/firewall-with-ufw"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1630591639000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["Now that the OS is ready, let's build out the web server environment in earnest. We'll use Tomcat, a representative WAS, to host pages."],"tags":["Raspberry Pi","Ubuntu","Domain"],"title":"[Raspberry Pi 4] Installing Tomcat on Ubuntu","type":"posts"},"url":"\/2021\/09\/02\/ubuntu-in-tomcat"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1630342299000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["By Thursday, delivery of all the supplies was complete. A clean Raspberry Pi doesn't have an OS installed and is in a FreeDOS state, so you have to install the OS yourself. Since I regularly reformat my computer and have run a few virtual machines, this shouldn't be much of a problem for me, but the catch is that this is a bit different from the computers I've dealt with so far. Since it's a device I'd never handled before, and there are several differences and constraints compared to a typical desktop, it wasn't entirely smooth sailing."],"tags":["Raspberry Pi","Ubuntu"],"title":"[Raspberry Pi 4] Installing Ubuntu on the Raspberry Pi","type":"posts"},"url":"\/2021\/08\/31\/ubuntu-in-raspberry"},{"body":"","meta":{"category":"RaspberryPi","createdAt":1630212101000,"group":"Raspberry Pi","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/131238727-666f2aaa-d759-4f62-af73-3856086da73d.png"],"subtitle":["A fair number of developers build their own servers, whether on the cloud or on a device, and put them to various uses. When developing, you inevitably need something like a server that's always running 24 hours a day. For example, GitHub Pages only hosts static pages — it can't use a backend or a DB, so dynamic page hosting is impossible. But if a personal API or DB server exists, communicating with that server makes more dynamic page hosting possible. Considering the role a backend plays on the web, the difference between having and not having a personal server you can use is night and day. As a developer, I too have long wanted a server I could use without restrictions, and I looked into ways to build a personal server."],"tags":["Raspberry Pi"],"title":"[Raspberry Pi 4] Hello Raspberry!","type":"posts"},"url":"\/2021\/08\/29\/hello-raspberry"},{"body":"","meta":{"category":"Algorithm","createdAt":1629909569000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Jimin has a bidirectional circular queue containing N elements. Jimin wants to extract several elements from this queue. Jimin can perform the following three operations on this queue. The number N originally contained in the queue is given. Also, the positions of the elements Jimin wants to extract are given (these positions refer to the original position in the queue). Write a program that outputs the minimum number of operations 2 and 3 required to extract those elements in the given order."],"tags":["Baekjoon","Algorithm","JAVA","Deque","SILVER","SILVER IV"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm 1021 - Rotating Queue","type":"posts"},"url":"\/2021\/08\/26\/a1021"},{"body":"","meta":{"category":"Algorithm","createdAt":1629735466000,"group":"Baekjoon Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Jimin has an N-digit digital counter whose number increases by one every second. The number shown on the counter wraps around — once it reaches 10^N-1, it starts again from 0. Each digit is made up of the following 7 segments. Every two adjacent segments are connected by a +. For example, 1 is made up of two segments, and 9 is made up of five segments. Given the number currently shown on the counter, write a program to find the minimum number of seconds that must pass before a number with the same total number of segments as the currently displayed number appears. The digits 1, 2, ..., 9, and 0 are made up of 2, 5, 5, 4, 5, 6, 3, 7, 5, and 6 segments respectively, and since every number must fill exactly N digits, numbers shorter than N digits may have leading zeros."],"tags":["Baekjoon","Algorithm","JAVA","Dynamic Programming","PLATINUM","PLATINUM II"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1020 - Digital Counter","type":"posts"},"url":"\/2021\/08\/24\/a1020"},{"body":"","meta":{"category":"Thoughts","createdAt":1629441780000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/130466968-83b176c7-2175-4740-85de-12914252d160.png"],"subtitle":["Color test"],"tags":["Development Blog"],"title":"Blog Text Color Examples","type":"posts"},"url":"\/2021\/08\/20\/color-test"},{"body":"","meta":{"category":"WEB","createdAt":1629387321000,"group":"SSL","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/129755999-c5d6c474-d5c0-442a-b7c5-37b3cdf703a9.png"],"subtitle":["Now that we've obtained an SSL certificate, let's apply it. This is typically applied to a web server like Nginx, or a WAS like Tomcat. This chapter explains the process based on Tomcat 9.0.50."],"tags":["CS","Object-Oriented Programming","SSL","Tomcat"],"title":"[SSL] Applying SSL to Tomcat","type":"posts"},"url":"\/2021\/08\/20\/apply-ssl"},{"body":"","meta":{"category":"WEB","createdAt":1629383841000,"group":"SSL","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/129755999-c5d6c474-d5c0-442a-b7c5-37b3cdf703a9.png"],"subtitle":["Now that we have a domain, let's use it to obtain an SSL certificate. Of course, obtaining an SSL certificate also costs money. Most active domain providers also offer SSL issuance alongside domains. For testing purposes, SSL issuance would be an unwelcome cost, just like the domain was. There are also ways to obtain SSL for free, and there are actually far more options for this than there were for the domain."],"tags":["CS","Object-Oriented Programming","SSL"],"title":"[SSL] Getting a Free SSL Certificate with Let's Encrypt on Windows 10","type":"posts"},"url":"\/2021\/08\/19\/lets-encrypt"},{"body":"","meta":{"category":"WEB","createdAt":1629297883000,"group":"SSL","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/129755999-c5d6c474-d5c0-442a-b7c5-37b3cdf703a9.png"],"subtitle":["The previous posts covered what SSL is and how it works. To apply SSL to a site, you need to obtain an SSL certificate. And to obtain an SSL certificate, you need a domain to be verified against. You can easily get one from a domestic domain provider. The providers above offer a variety of services beyond just domains, including hosting. There are many other providers as well, both domestic and overseas. Prices and policies vary by provider, so shopping around can get you a good deal. Prices vary depending on the TLD (Top Level Domain), ranging from just a few thousand won per year on the cheap end, up to several hundred thousand won on the expensive end."],"tags":["CS","Object-Oriented Programming","SSL","Domain"],"title":"[SSL] Getting a Free Domain Using Freenom","type":"posts"},"url":"\/2021\/08\/18\/freenom-domain"},{"body":"","meta":{"category":"WEB","createdAt":1629213968000,"group":"SSL","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/129755999-c5d6c474-d5c0-442a-b7c5-37b3cdf703a9.png"],"subtitle":["If you've ever deployed a website, you've probably heard of SSL. The protocol for a URL with SSL applied starts with https:\/\/, and unlike http:\/\/, it has an added s meaning Secure. You can see that the address of this very site, https:\/\/blog.itcode.dev, also has SSL applied. The same goes for NAVER and Google. As you can see, SSL isn't a concept that's only familiar to web developers. If you've ever used the internet, it's safe to say you've encountered SSL whether you realized it or not."],"tags":["CS","Object-Oriented Programming","SSL","TLS"],"title":"[SSL] What is SSL?","type":"posts"},"url":"\/2021\/08\/18\/about-ssl"},{"body":"","meta":{"category":"WEB","createdAt":1629251724000,"group":"SSL","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/129755999-c5d6c474-d5c0-442a-b7c5-37b3cdf703a9.png"],"subtitle":["If you've read the previous chapter, you'll have noticed a mention of certificates. We explained how, once SSL is applied, the server and client communicate and handle data through encryption\/decryption, but that's just the underlying principle of SSL. So then, why exactly is a domain able to use https once SSL has been applied to it?"],"tags":["CS","Object-Oriented Programming","SSL"],"title":"[SSL] SSL Certificates","type":"posts"},"url":"\/2021\/08\/18\/about-ssl-license"},{"body":"","meta":{"category":"CS","createdAt":1629137195000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["The Dependency Inversion Principle states that an object should depend on high-level modules rather than low-level modules. That sounds a bit complicated. What exactly is a high-level module, and what's a low-level module? The definitions of high\/low-level modules are as follows. Substituting this definition into the Dependency Inversion Principle, we can rephrase it as: an object should depend on interfaces rather than on other objects. In other words, this can be interpreted to mean that, as much as possible, inheritance of objects should occur through interfaces."],"tags":["CS","Object-Oriented Programming","Five Principles of OOP","Dependency Inversion Principle","DIP"],"title":"[OOP] Five Principles of Object Orientation (SOLID) - Dependency Inversion Principle (DIP)","type":"posts"},"url":"\/2021\/08\/17\/dependency-inversion-principle"},{"body":"","meta":{"category":"CS","createdAt":1629109497000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["The Interface Segregation Principle states that an object should not depend on methods it does not use. It recommends inheriting\/implementing only the methods that are truly necessary, in order to prevent implementing meaningless methods on an object. If the object to be inherited is too large in scope, it's better to split its methods into smaller interfaces. The diagram above illustrates the problem that arises when inheriting from an object that is too large, and how splitting it into interfaces solves the problem. When the objects on the left and right each inherit from the object in the middle, the object on the left has no issue since it needs all of the implemented methods. The object on the right, however, doesn't need anything besides Method1. But because it inherited everything, it's forced to carry those methods whether it likes it or not — or in the worst case, it even has to implement methods it doesn't need. But let's instead split the methods of the object to be inherited into interfaces grouped by behavior. Then each object only needs to inherit the interface it actually needs, so each one ends up with only the methods it requires. This is what the Interface Segregation Principle aims for."],"tags":["CS","Object-Oriented Programming","Five Principles of OOP"],"title":"[OOP] Five Principles of Object Orientation (SOLID) - Interface Segregation Principle (ISP)","type":"posts"},"url":"\/2021\/08\/16\/interface-segregation-principle"},{"body":"","meta":{"category":"CS","createdAt":1629002531000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["The Liskov Substitution Principle states that when there is a parent object and a child object that inherits from it, the child object must be able to completely substitute for the parent object in any operation that calls the parent object. In object-oriented languages, inheritance occurs between objects. Through this process, a parent\/child relationship is defined. A child object inherits the characteristics of its parent object and can extend upon them. However, in this process, overreaching or extensions that stray from the intent of the object can lead to improper inheritance. The Liskov Substitution Principle recommends that, for proper inheritance, a child object's extension should fully follow the direction of the parent object."],"tags":["CS","Object-Oriented Programming","Five Principles of OOP","Liskov Substitution Principle","LSP"],"title":"[OOP] Five Principles of Object Orientation (SOLID) - Liskov Substitution Principle (LSP)","type":"posts"},"url":"\/2021\/08\/15\/liskov-subsitution-principle"},{"body":"","meta":{"category":"CS","createdAt":1628881480000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["The Open-Closed Principle is the principle that when handling objects, extension of an object should be open, while modification of an object should be closed. In short, it means showing what should be shown and hiding what should be hidden. To put it more simply, it means functionality can change or be extended, but the code implementing that functionality must not be modified. This principle sounds a bit odd, though. Functionality changing — OK. Extension — OK. But you can't modify the code?? That's a somewhat confusing requirement. Suppose you're modifying a single object. If doing so requires not only modifying that object but also chain-modifying the code of every other object that depends on it, that's hard to call good design. Think of a typical library as an example. When the code of an object that uses a library changes, the library's own code doesn't change along with it. In this way, the Open-Closed Principle pursues proper modularization and information hiding for each object, thereby minimizing dependency between objects and reducing the impact of code changes."],"tags":["CS","Object-Oriented Programming","Five Principles of OOP","Open-Closed Principle","OCP"],"title":"[OOP] Five Principles of Object Orientation (SOLID) - Open-Closed Principle (OCP)","type":"posts"},"url":"\/2021\/08\/14\/open-closed-principle"},{"body":"","meta":{"category":"CS","createdAt":1628786268000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["There are principles established for proper object-oriented design, and these five principles together are called the five principles of object orientation (SOLID). While not mandatory, the more you adhere to these rules, the more correctly designed your object-oriented code can be said to be. These five principles are as follows."],"tags":["CS","Object-Oriented Programming","Five Principles of OOP","Single Responsibility Principle","SRP"],"title":"[OOP] Five Principles of Object Orientation (SOLID) - Single Responsibility Principle (SRP)","type":"posts"},"url":"\/2021\/08\/13\/single-responsibility-principle"},{"body":"","meta":{"category":"CS","createdAt":1628695962000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["Object-oriented languages don't allow methods with the same name. For example, suppose there's a method implementing the behavior \"eat.\" There's no need to implement the same \"eat\" behavior twice. From this perspective, it makes sense that method names would need to be unique, since a method's name could even be considered its own identity. But thinking about it a bit more, this seems strange. Java lives and dies by types. Unlike JavaScript, you can't put just any type into a parameter—if you pass in anything other than the specified type, it gets ruthlessly rejected at compile time."],"tags":["CS","Object-Oriented Programming","Polymorphism"],"title":"[OOP] Characteristics of Object Orientation - Polymorphism","type":"posts"},"url":"\/2021\/08\/12\/polymorphism"},{"body":"","meta":{"category":"CS","createdAt":1628681553000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["It's a lazy weekend, and Mr. A is casually watching a movie. In it, the protagonist, a girl who'd lived her whole life mistreated, one day receives a massive inheritance from someone. It turns out she was the long-lost granddaughter of a wealthy conglomerate family! From there, she uses the inheritance to repay those who'd been kind to her, and deliver a satisfying revenge on those who'd looked down on her. Mr. A, who found it fairly satisfying, soon remembers that this kind of thing could never happen in real life. We call this inheritance. As a concept, inheritance like this used to only be something you'd see in movies or dramas. It was practically a fictional concept, one you'd only find in a dictionary."],"tags":["CS","Object-Oriented Programming","Inheritance","Abstraction"],"title":"[OOP] Characteristics of Object Orientation - Inheritance","type":"posts"},"url":"\/2021\/08\/11\/inheritance"},{"body":"","meta":{"category":"CS","createdAt":1628388305000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["An object—that is, the property of packaging a class's internal variables and methods together as one unit. If a variable or method declared in an object could be accessed haphazardly from anywhere without distinction, it would be hard to call it a proper object. A concept similar to encapsulation is information hiding. Information hiding conceals an object's internal implementation, ensuring that the object can only be interacted with through its designated methods. Both concepts aim to modularize objects by increasing their cohesion and independence. When an object is properly modularized, it becomes very easy to reuse at the module level. Replacing code duplicated across multiple pieces of logic with a module means you can apply changes just by modifying the source inside that module. This translates directly into easier maintenance."],"tags":["CS","Object-Oriented Programming","Encapsulation","Information Hiding","Access Modifiers"],"title":"[OOP] Characteristics of Object Orientation - Encapsulation and Information Hiding","type":"posts"},"url":"\/2021\/08\/08\/encapulation"},{"body":"","meta":{"category":"CS","createdAt":1628305605000,"group":"Object-Oriented Programming","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/128211434-7c28e08b-c867-4b08-98c0-bcf94f0e54b3.png"],"subtitle":["If you end up working in IT, chances are you'll work with at least one of Java, C++, or C#. What these three languages have in common—including Java, the most widely supplied and demanded language in Korea's IT industry—is that they're all object-oriented languages. Of course, the concept of functional programming has since emerged as well, but object-oriented programming, which arose after C's simple procedural approach, offered a new perspective on programming, and countless languages, big and small, have been influenced by it, knowingly or not. Despite being such an influential concept, when actually asked a related question, people often can't give a clear answer."],"tags":["CS","Object-Oriented Programming"],"title":"[OOP] What Is Object-Oriented Programming?","type":"posts"},"url":"\/2021\/08\/07\/what-is-oop"},{"body":"","meta":{"category":"Algorithm","createdAt":1628004386000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["In programming languages, recursion means a function calling itself. Recursion is one of the most important concepts in algorithms, and by its very nature, it can effectively improve complex computations and the time they take to run."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Recursion"],"title":"Recursive Iteration Using Recursion","type":"posts"},"url":"\/2021\/08\/04\/about-algorithm-chapter09"},{"body":"","meta":{"category":"Algorithm","createdAt":1627700317000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["This chapter covers stacks and queues. In fact, both of these data structures are essentially arrays with specific constraints applied. You might think this concept of a 'constraint' would only be useful in special situations, but on the contrary, the very rules imposed by these constraints make them useful in a huge number of places. The defining feature of stacks and queues is that data processing has an inherent order. According to their respective constraints, stacks and queues always process data in a fixed order. Thanks to this property, they're extremely useful for tasks that require ordering. Common examples include schedulers, waiting queues, and OS interrupt handling, which relies on a stack."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Queue","Stack"],"title":"Writing Leaner Code with Stacks and Queues","type":"posts"},"url":"\/2021\/07\/31\/about-algorithm-chapter08"},{"body":"","meta":{"category":"Algorithm","createdAt":1627567347000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["Of all the data formats we've covered so far, the array is probably the most effective for handling a large number of values. However, arrays are specialized for storing exactly one value per element. What would happen if you wanted to store two values in a single element? You'd end up representing it as something like [[A, 1], [B, 2], [C, 3]]. One downside of arrays is that finding a value quickly requires sorting them first. But once an array's depth gets deep, like an array containing other arrays as shown above, the structure gets complicated and increasingly hard to work with. What's more, searching for a desired element in an array requires a time complexity of at least O(logN). What if there were a data structure that could search for a desired value in constant time, like O(1), within a collection of data like an array? Somehow, this chapter seems like the place we'll find the answer."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Hash Table"],"title":"Blazing-Fast Lookups with Hash Tables","type":"posts"},"url":"\/2021\/07\/29\/about-algorithm-chapter07"},{"body":"","meta":{"category":"React","createdAt":1627242880000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/127343484-697c4678-edf3-49fa-8a4d-86775a804428.png"],"subtitle":["I remember first building this blog back around May. I'd gotten into React starting in April, and this blog was a rather haphazard first project, so I figured the result was probably even rougher than I thought. Sure enough (unfortunately?), the blog didn't disappoint that belief, and it kept showing all sorts of big and small issues along the way. None of them were critical enough to actually break functionality, but there were a few things that bugged me enough to be distracting. Nobody's really interested, but since I already did the work, I wanted to use this post to lay out the improvements I made to the blog."],"tags":["React","Next.js","Dev Blog","TypeScript","SCSS"],"title":"The Story of My Blog Overhaul","type":"posts"},"url":"\/2021\/07\/26\/brand-new"},{"body":"","meta":{"category":"Algorithm","createdAt":1627070080000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["Until now, we've always looked at algorithms from a pessimistic perspective. The advantage of this is clear: preparing for the worst means you're covered no matter what. But not all data represents the worst case, and in fact most cases fall within an ordinary range. In this chapter, we consider all scenarios and judge the appropriate algorithm based on the situation."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Insertion Sort"],"title":"Optimizing for the Positive Scenario","type":"posts"},"url":"\/2021\/07\/24\/about-algorithm-chapter06"},{"body":"","meta":{"category":"Algorithm","createdAt":1627051353000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["So far, we've quantified algorithm performance comparisons using Big O notation. But Big O notation isn't perfect for measuring an algorithm's performance either. In the previous chapter, we explained that both N(O^2) and N(N^2 - N) are considered N(O^2) under Big O notation. Because of this property, algorithms that actually show a clear difference can end up measured as having nearly identical performance under Big O notation."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Selection Sort"],"title":"Optimizing Code With and Without Big O","type":"posts"},"url":"\/2021\/07\/23\/about-algorithm-chapter05"},{"body":"","meta":{"category":"Algorithm","createdAt":1626439194000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["Having learned Big O notation in the previous chapter, we confirmed that we can compare algorithms against each other by comparing their time complexities. In this chapter, we'll design a bubble sort algorithm and see how it can be improved using Big O notation."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Bubble Sort"],"title":"Using Big O to Speed Up Code","type":"posts"},"url":"\/2021\/07\/16\/about-algorithm-chapter04"},{"body":"","meta":{"category":"Algorithm","createdAt":1626204097000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["Even for a single problem, there can be countless algorithms that solve it. If a problem can be solved by any method whatsoever, it deserves to be called an algorithm in its own right, but not all algorithms are created equal. That's because of differences in the efficiency with which they solve the problem. Even if two algorithms both ultimately solve the problem, some do so brute-force while others do so remarkably efficiently. And we would generally consider the latter to be more deserving of the name 'algorithm'."],"tags":["Data Structures","Algorithm","Grokking Algorithms","Big O Notation"],"title":"Big O Notation","type":"posts"},"url":"\/2021\/07\/14\/about-algorithm-chapter03"},{"body":"","meta":{"category":"Algorithm","createdAt":1625858497000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["In the IT field, an algorithm refers to code that embodies a method for solving a particular problem. A well-designed algorithm can process a problem far faster than a naive, straightforward approach. Since development involves an enormous variety of problems, and an even greater variety of ways to solve them, more complex problems demand more sophisticated algorithm design."],"tags":["Data Structures","Algorithms","Grokking Algorithms","Arrays","Sorting","Binary Search"],"title":"Why Algorithms Matter","type":"posts"},"url":"\/2021\/07\/10\/about-algorithm-chapter02"},{"body":"","meta":{"category":"Algorithm","createdAt":1625848256000,"group":"Grokking Algorithms","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/125144706-add9c080-e159-11eb-9522-063c655ddf36.png"],"subtitle":["Studying alone is fine and all, but it's inefficient. I spend most of my time sitting in front of the computer, but if you ask me how much of that is genuinely spent studying, I have to look away awkwardly. Since I'd just started developing and using my own blog, I decided to join a study group to help with studying too. After selling off my laptop, I'd wanted to join a study group but couldn't — so the moment I heard I could join without a laptop, I signed up right away."],"tags":["Data Structures","Algorithms","Grokking Algorithms","Arrays"],"title":"Why Data Structures Matter","type":"posts"},"url":"\/2021\/07\/10\/about-algorithm-chapter01"},{"body":"","meta":{"category":"Algorithm","createdAt":1624850930000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Jimin has a book with a total of N pages. The first page is page 1, and the last page is page N. Let's find out how many times each digit appears across all the page numbers."],"tags":["Baekjoon","Algorithm","JAVA","GOLD","GOLD I"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1019 - Book Pages","type":"posts"},"url":"\/2021\/06\/28\/a1019"},{"body":"","meta":{"category":"Algorithm","createdAt":1624693580000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Jimin found a board of size M*N, divided into MN unit squares, in his mansion. Some of the squares are painted black, and the rest are painted white. Jimin wants to cut this board to make an 8*8 chessboard. A chessboard must be painted with black and white alternating. Specifically, each square is painted either black or white, and any two squares sharing an edge must be painted a different color. Following this definition, there are only two ways to paint a chessboard: one where the top-left square is white, and one where it's black. Since there's no guarantee the board is already painted like a chessboard, Jimin thought that after cutting out an 8 x 8 chessboard, he might need to repaint some of the squares. Of course, the 8*8 section can be chosen from anywhere on the board. Write a program to find the minimum number of squares Jimin needs to repaint."],"tags":["Baekjoon","Algorithm","JAVA","SILVER","SILVER V","Brute Force"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1018 - Repainting the Chessboard","type":"posts"},"url":"\/2021\/06\/26\/a1018"},{"body":"","meta":{"category":"Algorithm","createdAt":1624645172000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Given a list of numbers, Jimin wants to pair them up so that the sum of each pair is a prime number. For example, suppose we have {1, 4, 7, 10, 11, 12}. Jimin can group them as follows: 1 + 4 = 5, 7 + 10 = 17, 11 + 12 = 23, or 1 + 10 = 11, 4 + 7 = 11, 11 + 12 = 23. Given a list of numbers, write a program that, when Jimin pairs up all the numbers, prints in ascending order which numbers can be paired with the first number. In the example above, 1 + 12 = 13, which is prime. However, there is no way to pair up the remaining 4 numbers such that their sums are all prime. Therefore, the answer for the example is 4, 10."],"tags":["Baekjoon","Algorithm","JAVA","PLATINUM","PLATINUM III","Sieve of Eratosthenes","Bipartite Matching"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1017 - Prime Pairs","type":"posts"},"url":"\/2021\/06\/26\/a1017"},{"body":"","meta":{"category":"Algorithm","createdAt":1624375351000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["A number X is called a squarefree number when it is not divisible by any square number greater than 1. A square number is the square of an integer. Given min and max, print how many squarefree numbers exist between min and max, inclusive."],"tags":["Baekjoon","Algorithm","JAVA","GOLD","GOLD I","Sieve of Eratosthenes"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1016 - Squarefree Numbers","type":"posts"},"url":"\/2021\/06\/23\/a1016"},{"body":"","meta":{"category":"Algorithm","createdAt":1624292611000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["P[0], P[1], ..., P[N - 1] is a sequence containing each of the numbers from 0 to N - 1 (inclusive) exactly once. Applying sequence P to an array A of length N produces an array B of length N. The method of application is B[P[i]] = A[i]. Given array A, write a program that finds the sequence P such that the result of applying P is non-decreasing. Non-decreasing means each element is greater than or equal to the element immediately before it. If there are multiple such sequences, print the one that comes first in lexicographic order."],"tags":["Baekjoon","Algorithm","JAVA","SILVER","SILVER IV","Sorting"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1015 - Sequence Sort","type":"posts"},"url":"\/2021\/06\/22\/a1015"},{"body":"","meta":{"category":"Algorithm","createdAt":1624002164000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Professor Choi Baekjoon teaches a course called 'The Art of Cheating' at Sogang University. This course has a solid reputation for being quite tricky, so some students try to copy other people's answers during exams. The exam takes place in a rectangular classroom that is N rows by M columns in size. The classroom is made up of unit squares of size 1 x 1, each representing one seat. To prevent cheating, Choi Baekjoon devised the following strategy. Assume that every student always copies the answers of whoever sits to their left, right, diagonally up-left, or diagonally up-right — four seats in total. Therefore, the seating arrangement must be laid out so that no student is able to cheat."],"tags":["Baekjoon","Algorithm","JAVA","PLATINUM","PLATINUM IV","Network Flow","Minimum Vertex Cover","Bipartite Matching"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1014 - Cheating","type":"posts"},"url":"\/2021\/06\/18\/a1014"},{"body":"","meta":{"category":"JAVA","createdAt":1623603361000,"hasComment":true,"hasPublish":true,"images":["https:\/\/www.textrazor.com\/img\/letters3.png"],"subtitle":["When solving algorithm problems, you inevitably end up handling input values. To cover various cases, you take user input directly and process it. When you do, nine times out of ten, the following situation comes up. To send a dataset, a collection of data is joined into a single string using a delimiter (space or comma)."],"tags":["JAVA","String","split","StringTokenizer"],"title":"[JAVA] split vs StringTokenizer","type":"posts"},"url":"\/2021\/06\/14\/split-and-stringtokenizer"},{"body":"","meta":{"category":"JAVA","createdAt":1623675556000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/121893356-d6d48480-cd58-11eb-80bb-d4611be3bd40.png"],"subtitle":[""],"tags":["IntelliJ","Hyper-V","Troubleshooting"],"title":"Error on IntelliJ startup (java.net.BindException: Address already in use: bind)","type":"posts"},"url":"\/2021\/06\/14\/intellij-error-onstart"},{"body":"","meta":{"category":"Algorithm","createdAt":1623527612000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["The Arecibo radio telescope, located in Arecibo, Puerto Rico, has spent decades gazing at the night sky in an attempt to receive radio waves from an alien civilization that may not even exist. Efforts to find patterns in the radio waves collected by this telescope that could not naturally occur, and to use them as evidence for the existence of extraterrestrial civilizations, have continued unabated, but no such pattern has been discovered yet. Dr. Kim Dong-hyeok, the pride of Korean astronomy, adopted the following radio wave notation as a standard in order to carry out this kind of search using domestic technology."],"tags":["Baekjoon","Algorithm","JAVA","Regular Expressions","GOLD","GOLD V"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1013 - Contact","type":"posts"},"url":"\/2021\/06\/13\/a1013"},{"body":"","meta":{"category":"Algorithm","createdAt":1623516130000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Hanna, a next-generation farmer, has decided to grow organic cabbage in the highlands of Gangwon-do. Since protecting cabbage from pests is important when growing cabbage without using pesticides, Hanna decides to purchase cabbage whiteworms, which are effective at pest control. These worms live near cabbages and protect them by eating pests. In particular, if even a single cabbage whiteworm lives on a cabbage, it can move to an adjacent cabbage, so that cabbage is also protected from pests. (Two cabbages are considered adjacent when one is located directly above, below, to the left, or to the right of the other.)"],"tags":["Baekjoon","Algorithm","JAVA","DFS (Depth-First Search)","BFS (Breadth-First Search)","SILVER","SILVER II"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm Problem 1012 - Organic Cabbage","type":"posts"},"url":"\/2021\/06\/13\/a1012"},{"body":"","meta":{"category":"Algorithm","createdAt":1623388449000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["As a child, Woohyun believed that a future would come where humanity could live on planets other than Earth. Now, 23 years after he first set foot on this world called Earth, he is the world's youngest ASNA astronaut, waiting for the glorious moment when he'll set foot on a new world. The spaceship he'll board carries a large-scale life support system to help settle Alpha Centauri, a new home for humanity, and because of its enormous size and mass, it's equipped with a space-jump device developed by mobilizing the latest technology. However, this space-jump device has the drawback of causing serious mechanical faults if the travel distance increases too sharply, so if it moved k light-years the previous time it was activated, it can only move k - 1, k, or k + 1 light-years the next time."],"tags":["Baekjoon","Algorithm","JAVA(Java)","SILVER","SILVER I"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1011 Fly Me to the Alpha Centauri","type":"posts"},"url":"\/2021\/06\/11\/a1011"},{"body":"","meta":{"category":"Algorithm","createdAt":1623215649000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Jaewon has become the mayor of a city. This city has a large, straight river running through it, dividing the city into east and west. However, Jaewon realized that citizens were having great difficulty crossing the river because there were no bridges, so he decided to build some. A location along the river suitable for building a bridge is called a site. After carefully surveying the area around the river, Jaewon found that there are N sites on the west side of the river and M sites on the east side. (N ≤ M)"],"tags":["Baekjoon","Algorithm","JAVA(Java)","Combination","SILVER","SILVER V"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1010 Building Bridges","type":"posts"},"url":"\/2021\/06\/09\/a1010"},{"body":"","meta":{"category":"Algorithm","createdAt":1623204398000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Jaeyong owns 10 state-of-the-art computers. One day, Jaeyong had a lot of data to process, so he assigned each computer a number from 1 to 10, and decided that the 10 computers would process the data in the following way."],"tags":["Baekjoon","Algorithm","JAVA(Java)","Math","BRONZE","BRONZE IV"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1009 Distributed Processing","type":"posts"},"url":"\/2021\/06\/09\/a1009"},{"body":"","meta":{"category":"Algorithm","createdAt":1623201931000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Given two integers A and B, write a program that outputs A \/ B."],"tags":["Baekjoon","Algorithm","JAVA(Java)","Arithmetic","BRONZE","BRONZE IV"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1008 A \/ B","type":"posts"},"url":"\/2021\/06\/09\/a1008"},{"body":"","meta":{"category":"Algorithm","createdAt":1623167426000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["There are N points marked on a plane, and let's call this set of points P. A vector matching of set P is a set of vectors, where every vector starts at one point in set P and ends at another point. Also, every point belonging to P must be used exactly once. The number of vectors in V is half the number of points in P. Given the points on the plane, write a program that outputs the minimum length of the sum of the vectors in the vector matching of set P."],"tags":["Baekjoon","Algorithm","JAVA(Java)","Brute Force","Combination","GOLD","GOLD II"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1007 Vectors","type":"posts"},"url":"\/2021\/06\/09\/a1007"},{"body":"","meta":{"category":"Jekyll","createdAt":1623076931000,"group":"Jekyll Blog","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/90983201-582f1080-e5a7-11ea-970b-8d7d82cb2084.png"],"subtitle":["GitHub manages each project as a single Repository. A created Repository can be managed using Git. The GitHub page itself allows you to create, modify, and delete files within a Repository, but that's very cumbersome, so it's generally recommended to use Git instead."],"tags":["GitHub Pages","Jekyll","Blog"],"title":"[Jekyll] Building My Own Blog with GitHub Pages - 4. Shopping for Jekyll Themes","type":"posts"},"url":"\/2021\/06\/07\/jekyll-blog-jekyll-shopping"},{"body":"","meta":{"category":"Jekyll","createdAt":1622989105000,"group":"Jekyll Blog","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/90983201-582f1080-e5a7-11ea-970b-8d7d82cb2084.png"],"subtitle":["You can create your own blog through a major portal or one of many big and small platforms. Blogs built on such platforms are easy and convenient — you can set one up with a linked account and a few button clicks. However, blogs like this have a fixed basic page frame, and free customization is fairly limited. To build a blog that reflects your own color or values, you need to find a way that isn't so-called \"off-the-shelf,\" which in turn leads to the large task of building the entire web service yourself, from creating and publishing pages to hosting. Even if you somehow manage to build the page, features beyond the frame itself, like design via CSS or extra functionality via JavaScript, are even harder than building the frame. Even if you somehow pulled all of that off on your own, hosting costs money. If you add a DB on top of that, the cost grows even larger. All I wanted was a simple blog."],"tags":["GitHub Pages","Jekyll","Blog"],"title":"[Jekyll] Building My Own Blog with GitHub Pages - 1. What is Jekyll?","type":"posts"},"url":"\/2021\/06\/06\/jekyll-blog-start"},{"body":"","meta":{"category":"Jekyll","createdAt":1622990531000,"group":"Jekyll Blog","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/90983201-582f1080-e5a7-11ea-970b-8d7d82cb2084.png"],"subtitle":["GitHub manages each project as a single Repository. A created Repository can be managed using Git. The GitHub page itself allows you to create, modify, and delete files within a Repository, but that's very cumbersome, so it's generally recommended to use Git instead."],"tags":["GitHub Pages","Jekyll","Blog","Git"],"title":"[Jekyll] Building My Own Blog with GitHub Pages - 3. Installing Git","type":"posts"},"url":"\/2021\/06\/06\/jekyll-blog-prepare-git"},{"body":"","meta":{"category":"Jekyll","createdAt":1622989772000,"group":"Jekyll Blog","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/90983201-582f1080-e5a7-11ea-970b-8d7d82cb2084.png"],"subtitle":["Jekyll is hosted through GitHub. In other words, to build a blog with Jekyll, you need at least some familiarity with GitHub. In this post, we'll set aside GitHub's many other features and focus purely on what's needed for Jekyll hosting."],"tags":["GitHub Pages","Jekyll","Blog","GitHub"],"title":"[Jekyll] Building My Own Blog with GitHub Pages - 2. Getting to Know GitHub","type":"posts"},"url":"\/2021\/06\/06\/jekyll-blog-github"},{"body":"","meta":{"category":"Algorithm","createdAt":1622986922000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["Chorage is a special agent who has been given the mission of raiding Korea's secret national defense base (Ontagon). The Ontagon building is donut-shaped, and to determine efficient strike points, Chorage divided the area into two circular zones as shown below. (The numbers in the diagram indicate each zone's number.) Chorage plans to deploy multiple special squads, each consisting of W members, to infiltrate every zone, and Chorage knows exactly how many enemy soldiers are stationed in each zone. The special squads can infiltrate under the following conditions."],"tags":["Baekjoon","Algorithm","JAVA(Java)","Dynamic Programming","PLATINUM","PLATINUM III"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1006 Raider Chorage","type":"posts"},"url":"\/2021\/06\/06\/a1006"},{"body":"","meta":{"category":"CS","createdAt":1622708723000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120613280-0a79f980-c491-11eb-81a9-15e63062db75.png"],"subtitle":["Ever since the days of punch cards, computer languages have undergone countless advances. Nowadays, synergies between developed languages have caused new languages and concepts to be created almost daily. But no matter how new the language used to build a piece of software, the entity that ultimately executes the program is the computer. No matter how much we fuss over new languages, frameworks, and technologies, in the end, it must be something the computer can understand in order to run. Fitting for a global era where even elementary school students speak more than one foreign language, unfortunately our computers have stubbornly stuck to machine language alone since their inception. Setting aside Korean or English, most of the programming languages we use for development — even assembly language, which is lower-level than C — are no different from alien language as far as the computer is concerned."],"tags":["Compiler","Interpreter"],"title":"Compiler & Interpreter","type":"posts"},"url":"\/2021\/06\/03\/compiler-interpreter"},{"body":"","meta":{"category":"Algorithm","createdAt":1622478476000,"group":"Baekjoon Algorithm","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028591-d5ece480-c02f-11eb-88f0-e14fc647dd81.png"],"subtitle":["In the year 2012! The game ACM Craft (Association of Construction Manager Craft), which has kept countless citizens waiting for two years, has finally been released. Unlike previous games, ACM Craft does not have a fixed order for constructing buildings, allowing for dynamic gameplay. In other words, the first game and the second game may have a different building order. At the start of each game, the building order is given. Also, every building has a delay from the start of construction until its completion."],"tags":["Baekjoon","Algorithm","JAVA(Java)","Dynamic Programming","Topological Sort","GOLD","GOLD III"],"title":"[Baekjoon \/ JAVA] Baekjoon Algorithm #1005 ACM Craft","type":"posts"},"url":"\/2021\/06\/01\/a1005"},{"body":"","meta":{"category":"JAVA","createdAt":1622308595000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120079117-78b76880-c0ed-11eb-944d-c0d020228db3.png"],"subtitle":["Occasionally when running a JAVA program, you'll run into an error where an Unsupported major.minor version 52 message (the number varies depending on the class version) is printed and the program fails to run correctly. The Unsupported major.minor version error, translated literally, means \"unsupported major\/minor version.\" You can think of it as a JAVA version-related error."],"tags":["JAVA","WAS","Tomcat","Troubleshooting"],"title":"Fixing the Unsupported major.minor version Error (+Servlet 404 Error)","type":"posts"},"url":"\/2021\/05\/30\/unsupported-version-error"},{"body":"","meta":{"category":"WEB","createdAt":1622226617000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120028437-a63ddc80-c02f-11eb-9d41-7c50d7002a42.png"],"subtitle":["When we access a particular piece of data on the internet, we use something called a URL to access it. Once you have the URL for the resource you want, you can call that URL from an HTTP communication program like a browser to get the response."],"tags":["WEB","URI","URL","URN"],"title":"URI? URL? URN? Distinguishing Resource Identifiers","type":"posts"},"url":"\/2021\/05\/29\/uri-url-urn"},{"body":"","meta":{"category":"WAS","createdAt":1622014336000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/119212068-1b218b80-baf1-11eb-9a42-85945bceb7d9.png"],"subtitle":["Mr. A is starting up Tomcat like any other day. Tomcat, which had been working fine until yesterday, immediately shuts down during startup due to some error. Right before it closed, some kind of error message seemed to flash by... but it happened too fast to catch. Mr. A has no choice but to dig through the logs one by one to fix the error. Nothing was changed on his end, so why is this happening?"],"tags":["WAS","Tomcat","Console"],"title":"Running Tomcat in the Current Console Window","type":"posts"},"url":"\/2021\/05\/26\/tomcat-current-window"},{"body":"","meta":{"category":"WAS","createdAt":1621655571000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/119212068-1b218b80-baf1-11eb-9a42-85945bceb7d9.png"],"subtitle":["A phenomenon you run into fairly often when running Tomcat — not quite an error, more of a symptom. It happens because Windows Console's default encoding and the encoding Tomcat outputs in don't match."],"tags":["WAS","Tomcat","Console"],"title":"Fixing Garbled Korean Text in the Tomcat Console","type":"posts"},"url":"\/2021\/05\/22\/tomcat-encoding-euckr"},{"body":"","meta":{"category":"WEB","createdAt":1621655571000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/120056028-b2985880-c074-11eb-8cc3-39f5f10a2c7f.png"],"subtitle":["To understand domains, we need to first go over IP. Every device connected to the internet (computers, smartphones, routers, etc.) has a unique IP address made up of a series of numbers. IP addresses can be broadly classified by mutability into dynamic IPs and static IPs. Dynamic IP: an IP address that gets renewed at arbitrary points in time. The renewal interval isn't fixed. Applies to most internet connections. Static IP: an IP fixed to a connection line that never gets renewed. Provided as an add-on service, and suitable for cases like shopping malls or companies that need to run a system continuously. Just as we look up an address to visit a place we want to go, visiting a website run on a particular server requires the IP that serves as that se
