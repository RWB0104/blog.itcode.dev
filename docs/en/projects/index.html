        <script id="vike_pageContext" type="application/json">{"locale":"en","urlLogical":"\/projects","pageId":"\/pages\/projects","routeParams":{},"data":[{"body":"","meta":{"category":"React","createdAt":1717216942690,"hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/7cb346d2-9499-4de1-8e99-055913dd4b82"],"subtitle":["Let's go over how the blog changed and what the focus was during this 5th renewal."],"tags":["React","Next.js","Markdown","NX","Monorepo"],"title":"The 5th Generation","type":"projects"},"url":"\/2024\/06\/01\/5th-generation"},{"body":"","meta":{"category":"GIS","createdAt":1695496723000,"group":"A Guide for Programmers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["If you've read through this series, you've likely seen the OpenLayers6 Sandbox, which shows examples alongside code. That site was built to intuitively show the results of the code. I thought that seeing the actual implemented result would be much easier to understand than just looking at code. Showing example sites is good, but I thought it would allow for even freer exploration if I also explained how to build your own GeoServer and connect it to the example site. In this chapter, I'll provide all the data I actually used on the example site, along with the setup method for GeoServer, so we can connect the OpenLayers6 Sandbox site to our own GeoServer."],"tags":["GIS","GeoServer","OpenLayers","React"],"title":"A Guide for Programmers Traveling Through OpenLayers - 26. Hands-On! Running OpenLayers6 Sandbox with My Own GeoServer","type":"projects"},"url":"\/2023\/09\/24\/gis-guide-for-programmer-26"},{"body":"","meta":{"category":"React","createdAt":1694955466000,"hasComment":true,"hasPublish":true,"images":["https:\/\/project.itcode.dev\/piedit\/thumb.png"],"subtitle":["Generally, when writing posts on a website, an HTML-based editor is commonly used. But on development-related sites, it's not uncommon to see markdown-based editors used instead. My blog too, while not written directly on the web, is written based on markdown. It lets me write intuitively while also being highly compatible with HTML, so there's no issue rendering it on the web either. Plus, there's a variety of supporting plugins as a bonus. I've added rendering code to make the blog's content look polished. Code blocks are one example of this."],"tags":["React","Next.js","Markdown"],"title":"My Experience Developing Piedit","type":"projects"},"url":"\/2023\/09\/17\/piedit"},{"body":"","meta":{"category":"React","createdAt":1694196059000,"hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/2bb32e45-a33c-4cd2-9ad7-86a36f14abd9"],"subtitle":["It feels like it wasn't long ago that I overhauled the blog for the third time because I didn't like how it looked, and yet here I am, before I knew it, already overhauling it for the fourth time. My last blog post was from almost half a year ago, since I hardly paid any attention to the blog while developing a toy project. What's more, since the 3rd renewal I've picked up a variety of frontend skills. Because my standards rose along with that, part of the reason was that I just couldn't stand the blog's UI anymore. Fortunately, I had quite a few posts already written, and a few of them turned out to be reliable earners, so visitor numbers didn't decline."],"tags":["React","Next.js","Material UI","Giscus"],"title":"On Realizing I've Overhauled the Blog Four Times","type":"projects"},"url":"\/2023\/09\/09\/4th-renewal"},{"body":"","meta":{"category":"React","createdAt":1654872685000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/173095674-228ad2b4-ef60-4c9c-9f2a-78058cde9cf2.png"],"subtitle":["As one of the tasks assigned to me at work, I was given the job of turning components into a library and publishing them to npm. In other words, I needed to develop a component library like react-bootstrap. My only prior experience with code publishing was deploying a JAVA open-source library to Maven once, so publishing in this new development environment inevitably led to trial and error. What I felt while developing was that there just weren't many deep references to look at, and I couldn't find suitable code I could just reuse. Fortunately, by grinding through it over time, I was able to establish some kind of foundation. It was fairly fun, seemed worth digging into, and since there didn't seem to be a widely-known reference for it either, I decided to try making one myself."],"tags":["React","Rollup.js","npm","Library"],"title":"My Experience Developing a React Component Library with Rollup.js","type":"projects"},"url":"\/2022\/06\/10\/react-components-library-starter"},{"body":"","meta":{"category":"React","createdAt":1654437679000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/172054319-11955bfc-e4f3-4a30-b8fb-0de34f57c001.png"],"subtitle":["After rebuilding my blog with Next.js, I didn't do much maintenance beyond writing new posts. I had my reasons — there was no major problem using it as-is, and honestly it was a hassle. Coming up with and placing the right components was quite a bother too. There were a few problems with my blog, one of which was that the About page had nothing on it. I'd tried to write some kind of blog introduction, but I didn't have a good idea for it. Then, out of nowhere, a decent idea popped into my head: \"Wouldn't it be nice to show a commit list on the About page?\" It seemed like a decent idea, so I started developing it, but suddenly the ugly parts of the blog started bothering me. Unable to bear seeing those ugly parts all of a sudden, I ended up starting an unplanned blog renewal."],"tags":["React","Next.js","Dev Blog"],"title":"Blog 3rd Renewal","type":"projects"},"url":"\/2022\/06\/05\/blog-renewal"},{"body":"","meta":{"category":"GIS","createdAt":1654099031000,"group":"A Guide for Programmers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["I've mentioned before that the more objects there are to represent with WFS markers, the more it directly translates into cost. But what if — and this is a big if — you really need to show every single one of a huge number of objects as markers? Whatever the reason, if you run into this problem, WebGL can be the solution. In this chapter, we use the WebGL renderer to display 300,000 markers."],"tags":["GIS","GeoServer","OpenLayers","WFS","WebGL"],"title":"A Guide for Programmers Traveling Through OpenLayers - 25. Displaying Massive Data with WebGL","type":"projects"},"url":"\/2022\/06\/02\/gis-guide-for-programmer-25"},{"body":"","meta":{"category":"GIS","createdAt":1654097277000,"group":"A Guide for Programmers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Data can produce completely different results depending on your perspective. All the maps we've dealt with so far have focused on showing data exactly as it is on the map. In this chapter, we shift our perspective on data a bit through the Heat Map."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"A Guide for Programmers Traveling Through OpenLayers - 24. Displaying a Heat Map","type":"projects"},"url":"\/2022\/06\/02\/gis-guide-for-programmer-24"},{"body":"","meta":{"category":"GIS","createdAt":1654019952000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Markers on a map are typically managed as WFS objects since they're the primary element through which interaction with the user takes place. Because rendering is object-based, the more data there is, the more it directly translates into service cost. As you can see, an excessive number of markers loses its meaning as data. With too many elements, visibility drops drastically, and meaningful interaction also becomes impossible. This is a common mistake made when trying to show as much data as possible. Even setting visibility aside, a map displaying that many markers is very slow."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"A Guide for Developers Traveling Through OpenLayers - 23. Representing a Cluster Map","type":"projects"},"url":"\/2022\/06\/01\/gis-guide-for-programmer-23"},{"body":"","meta":{"category":"GIS","createdAt":1653929177000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Among the three WFS Transaction APIs, let's cover the final step, deleting data."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"A Guide for Developers Traveling Through OpenLayers - 22. Deleting Data with WFS Transaction","type":"projects"},"url":"\/2022\/05\/31\/gis-guide-for-programmer-22"},{"body":"","meta":{"category":"GIS","createdAt":1653927012000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Among the three WFS Transaction APIs, let's cover Update, which modifies data."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"A Guide for Developers Traveling Through OpenLayers - 21. Modifying Data with WFS Transaction","type":"projects"},"url":"\/2022\/05\/31\/gis-guide-for-programmer-21"},{"body":"","meta":{"category":"GIS","createdAt":1653839746000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Up to now, all we've done is call data through GeoServer and display it. Whether displaying it as objects, drawing it as an image, or presenting the data directly, in the end it was all just about showing data in some form. This document, along with the next two, covers inserting\/updating\/deleting spatial data. Using the WFS Transaction protocol, you can perform CUD operations on data following a fixed pattern. This document specifically covers WFS Transaction Insert — that is, adding spatial data."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"A Guide for Developers Traveling Through OpenLayers - 20. Adding Data with WFS Transaction","type":"projects"},"url":"\/2022\/05\/30\/gis-guide-for-programmer-20"},{"body":"","meta":{"category":"GIS","createdAt":1653738923000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["When you click a marker or object displayed on the map, a popup shows detailed information about that object. In this chapter, we'll display a popup on a WFS map to show a marker's detailed information."],"tags":["GIS","GeoServer","OpenLayers","WMS"],"title":"A Guide for Developers Traveling Through OpenLayers - 19. Attaching a Popup to WMS","type":"projects"},"url":"\/2022\/05\/28\/gis-guide-for-programmer-19"},{"body":"","meta":{"category":"GIS","createdAt":1653487206000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["When you click a marker or object displayed on the map, a popup shows detailed information about that object. In this chapter, we'll display a popup on a WFS map to show a marker's detailed information."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"A Guide for Developers Traveling Through OpenLayers - 18. Attaching a Popup to WFS","type":"projects"},"url":"\/2022\/05\/25\/gis-guide-for-programmer-18"},{"body":"","meta":{"category":"GIS","createdAt":1653069899000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["The biggest difference between WFS and WMS lies in the result of the data. WFS returns spatial elements as GeoJSON, while WMS directly renders a map based on the spatial elements and provides that. OpenLayers renders objects onto a `canvas` based on WFS data. Think of it as drawing a kind of shape based on the spatial information. Unlike images, since these are objects drawn directly on the web, the web has the great advantage of being able to recognize or manipulate them."],"tags":["GIS","GeoServer","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 17. Adding Interactions to WFS Objects","type":"projects"},"url":"\/2022\/05\/21\/gis-guide-for-programmer-17"},{"body":"","meta":{"category":"GIS","createdAt":1652634790000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["This chapter covers how to display images on the map via WFS. While WFS in the previous chapter received spatial data as GeoJSON and displayed it directly as objects, WMS receives an image that GeoServer has rendered from objects and displays that. In other words, you can think of it as receiving a Tile Map directly from GeoServer and rendering it."],"tags":["GIS","GeoServer","OpenLayers","OGC","WMS"],"title":"A Guide for Developers Traveling Through OpenLayers - 16. Displaying Images on the Map Using WMS GetImage","type":"projects"},"url":"\/2022\/05\/16\/gis-guide-for-programmer-16"},{"body":"","meta":{"category":"GIS","createdAt":1652550530000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Up to now, everything covered has been purely a feature of OpenLayers itself, but starting from this chapter, we'll gradually cover integration with GeoServer. The first feature we'll cover is WFS. In GeoServer, WFS returns the information of the specified elements in GeoJSON form. This information can be used appropriately to display it on the map. Through this feature, you can display data you directly manage or process on the map."],"tags":["GIS","GeoServer","OpenLayers","OGC","WFS"],"title":"A Guide for Developers Traveling Through OpenLayers - 15. Using WFS GetFeature to Display Objects on the Map","type":"projects"},"url":"\/2022\/05\/15\/gis-guide-for-programmer-15"},{"body":"","meta":{"category":"GIS","createdAt":1649004963000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Based on the user's location, various services can be provided, but among them, the most basic feature is directly displaying the user's location on the map. Based on the geolocation explained in the previous chapter, we display the location on the map using OpenLayers."],"tags":["GIS","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 14. Displaying the User's Location on the Map","type":"projects"},"url":"\/2022\/04\/04\/gis-guide-for-programmer-14"},{"body":"","meta":{"category":"GIS","createdAt":1648921805000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Among map services, some analyze the user's location and present content more appropriate to that location. For example, delivery apps preferentially show only restaurants within a certain range based on the user's location. For applications, the GPS of the smartphone, the primary device they run on, can be leveraged. Similarly, browsers can themselves collect and use location information with the user's consent. Naturally, an internet connection is required."],"tags":["GIS","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 13. Collecting the User's Location Information in the Browser","type":"projects"},"url":"\/2022\/04\/03\/gis-guide-for-programmer-13"},{"body":"","meta":{"category":"GIS","createdAt":1647956241000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["When working with maps, there are various situations where you need to obtain information such as the coordinates of the area you're currently viewing, the coordinates where the mouse is positioned on the map, the zoom level, and more. To satisfy these needs, creating a status panel on the map that outputs related information would be useful whenever needed."],"tags":["GIS","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 12. Displaying Useful Map Information","type":"projects"},"url":"\/2022\/03\/22\/gis-guide-for-programmer-12"},{"body":"","meta":{"category":"GIS","createdAt":1647874305000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["In the previous chapter, we displayed a map through OSM. However, OSM's map has an undeniable drawback: its lack of detail. Even though OSM has the great advantage of being an easy-to-use world map, that one drawback makes it difficult to use as a map for domestic Korean services. In other words, to use it for something more substantial than an example, a map specialized for Korean geography is needed."],"tags":["GIS","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 11. Creating a VWorld Map","type":"projects"},"url":"\/2022\/03\/21\/gis-guide-for-programmer-11"},{"body":"","meta":{"category":"GIS","createdAt":1647287580000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["OSM is a world map that map professionals from around the world autonomously manage. In other words, it's easiest to think of it as open source for the mapping field. Contributors from each country manage the map, and each country's territory is displayed in that country's language. It has the advantage of being applicable without issue to services targeting the entire world. However, based in Korea, the quality of the map isn't all that great. OpenLayers provides OSM by default at the library level. In other words, you can put a world map up on the web with just a few lines of simple code, without any special API calls or configuration. This chapter covers the very basic method of putting up OSM on the web using OpenLayers6."],"tags":["GIS","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 10. Creating an Open Street Map (OSM) Map","type":"projects"},"url":"\/2022\/03\/19\/gis-guide-for-programmer-10"},{"body":"","meta":{"category":"GIS","createdAt":1647274279000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["When calling WFS or WMS, there may be cases where more varied filtering is needed. You might need to call objects outside a specific area, call only data that spans a specific area, or query data by combining various conditions."],"tags":["GIS","GeoServer"],"title":"A Guide for Developers Traveling Through OpenLayers - 9. Filtering Data","type":"projects"},"url":"\/2022\/03\/15\/gis-guide-for-programmer-9"},{"body":"","meta":{"category":"GIS","createdAt":1647268652000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["OpenLayers is a JavaScript library for providing maps or GIS services in a web browser. Among GIS libraries, it has the highest barrier to entry, but it offers correspondingly powerful features."],"tags":["GIS","GeoServer"],"title":"A Guide for Developers Traveling Through OpenLayers - 8. How to Request Geospatial Data. OGC","type":"projects"},"url":"\/2022\/03\/14\/gis-guide-for-programmer-8"},{"body":"","meta":{"category":"GIS","createdAt":1646583153000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["In the previous chapter, we put geospatial data into a DB. Now, all that's left is to set up a proper way to communicate that data, and we'll be able to freely use the geospatial data stored in the DB from the web or from an app. But as mentioned time and again, geospatial data has a clear distinction from other kinds of data: it's spatial data. Because geospatial data isn't ordinary text-based data, it's extremely fragile when it comes to CRUD. Even though we put it into a DB to enable freer communication, it gains no real advantage for CRUD at all. In other words, whether it's MyBatis or JPA, ordinary DB communication makes it difficult to fully retrieve geospatial data."],"tags":["GIS","GeoServer"],"title":"A Guide for Developers Traveling Through OpenLayers - 7. How to Manage Geospatial Data: GeoServer","type":"projects"},"url":"\/2022\/03\/07\/gis-guide-for-programmer-7"},{"body":"","meta":{"category":"GIS","createdAt":1646422541000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Services that need to perform CRUD on data use a DB. Data needed to run the service is stored in the DB, and by properly managing and manipulating it, the service's features are delivered. In the case of GIS, due to its nature, large volumes of data are commonly encountered. For example, the number of buildings nationwide easily exceeds a few million. Not only is having millions of rows an issue by itself, but given the nature of building information, the number of columns is also often several dozen. All of this makes the data volume grow very large."],"tags":["GIS","MariaDB","QGIS"],"title":"A Guide for Developers Traveling Through OpenLayers - 6. Turning Geospatial Information into a DB","type":"projects"},"url":"\/2022\/03\/05\/gis-guide-for-programmer-6"},{"body":"","meta":{"category":"GIS","createdAt":1646419165000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["OpenLayers is a JavaScript Library for providing maps or GIS services in a web browser. Among GIS libraries, it has the steepest entry barrier, but it offers correspondingly powerful features."],"tags":["GIS","OpenLayers"],"title":"A Guide for Developers Traveling Through OpenLayers - 5. OpenLayers","type":"projects"},"url":"\/2022\/03\/05\/gis-guide-for-programmer-5"},{"body":"","meta":{"category":"GIS","createdAt":1646417125000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["I mentioned earlier that most geospatial data is provided in SHP by default. The trouble is, I have no idea how to open this SHP thing. Text-based data like GeoJSON or CSV can at least be opened and inspected somehow, but that's not possible with SHP. That's why we need some kind of tool that can open and manipulate SHP—fortunately several already exist, so it's not a big problem. There are two especially representative tools."],"tags":["GIS","QGIS"],"title":"A Guide for Developers Traveling Through OpenLayers - 4. Trying Out QGIS","type":"projects"},"url":"\/2022\/03\/05\/gis-guide-for-programmer-4"},{"body":"","meta":{"category":"GIS","createdAt":1646326049000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["In 1986, NASA launched the space shuttle Challenger, but it tragically exploded roughly 73 seconds after launch. The cause, absurdly enough, was a unit mistake. Even though the international standard is the metric system, the United States and a few other countries used the imperial system as their standard. Under these circumstances, the O-ring, a component specified in metric units on the spacecraft's design drawings, was manufactured using imperial units—and that mistake caused the accident."],"tags":["GIS"],"title":"A Guide for Developers Traveling Through OpenLayers - 3. Coordinate Systems","type":"projects"},"url":"\/2022\/03\/04\/gis-guide-for-programmer-3"},{"body":"","meta":{"category":"GIS","createdAt":1646318164000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["If you're new to GIS, I'd like to ask you something. What is space made of? Think about it for a moment. I imagine a variety of answers came to mind. It's a bit of a shame I can't actually hear what they were. But I suspect most of them were fairly abstract answers."],"tags":["GIS"],"title":"A Guide for Developers Traveling Through OpenLayers - 2. Getting to Know GIS","type":"projects"},"url":"\/2022\/03\/03\/gis-guide-for-programmer-2"},{"body":"","meta":{"category":"GIS","createdAt":1646316335000,"group":"A Guide for Developers Traveling Through OpenLayers","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["Unless you work in or have an interest in geospatial information or geography, the word GIS is a fairly unfamiliar term. Some people even ask, isn't it GPS, not GIS? GPS (Global Positioning System) is a technique for calculating a receiver's position using signals from three or more satellites. When you hear GPS, you tend to think of navigation, but whether we realize it or not, GPS has deeply woven itself into daily life. Navigation, smartphone maps, tracking rider locations for delivery platforms, drone swarm flight, military science, and more. GPS permeates a wide range of domains and delivers its benefits there. Through GPS, we can catch a glimpse of what kind of power comes from digitizing space in this digital age of geospatial information. GIS (Global Information System) refers, broadly, to every technology that deals with geospatial information, GPS included. Not just GPS, but every technology intertwined with space—maps, coordinate systems, and the like—can be grouped under the broad umbrella of GIS."],"tags":["GIS"],"title":"A Guide for Developers Traveling Through OpenLayers - 1. Introduction","type":"projects"},"url":"\/2022\/03\/03\/gis-guide-for-programmer-1"},{"body":"","meta":{"category":"React","createdAt":1635183450000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/138741601-2bca31f3-d08a-4789-9c99-6a835883fbe4.png"],"subtitle":["A development blog I built myself to put the React I ended up self-teaching to meaningful use. I developed it using NextJS for a static blog. I use Typescript, and the design is rendered using a CSS-in-CSS approach via SCSS. When I bought a Raspberry Pi, I also applied the domain itcode.dev, which I purchased at the same time to build a server. I use the subdomain blog, as in blog.itcode.dev."],"tags":["NextJS","React","Typescript","SCSS"],"title":"[React] The π-th Alpaca's Dev Scribble Project","type":"projects"},"url":"\/2021\/10\/26\/github-react-blog"}]}</script>
