        <script id="vike_pageContext" type="application/json">{"locale":"ko","urlLogical":"\/projects","pageId":"\/pages\/projects","routeParams":{},"data":[{"body":"","meta":{"category":"React","createdAt":1717216942690,"hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/7cb346d2-9499-4de1-8e99-055913dd4b82"],"subtitle":["5번 째 리뉴얼을 수행하며 블로그가 어떤식으로 변화됐는지, 어떤 것을 중점으로 삼았는지 다뤄본다."],"tags":["React","Next.js","Markdown","NX","Monorepo"],"title":"The 5th Generation","type":"projects"},"url":"\/2024\/06\/01\/5th-generation"},{"body":"","meta":{"category":"GIS","createdAt":1695496723000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["이 시리즈를 쭉 정독했다면, 코드와 함께 예시로 보여주는 OpenLayers6 Sandbox를 봤을 것이다. 해당 사이트는 코드의 결과를 직관적으로 보여주기 위해 만든 예시 사이트다. 코드로 보는 것보다, 직접 구현된 결과물을 보는 것이 이해가 훨씬 빠를거라 생각했다. 예시 사이트를 보여주는 것도 좋지만, 자신이 직접 GeoServer를 구축하고 이를 예시 사이트에 연결하는 방법을 알려준다면, 더 자유롭게 탐구를 할 수 있지 않을까 싶었다. 이 장에선, 내가 직접 예시 사이트에 사용한 데이터 일체와 GeoServer의 구축 방식을 제공하여, OpenLayers6 Sandbox 사이트를 내 GeoServer로 연결하여 구축해본다."],"tags":["GIS","GeoServer","OpenLayers","React"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 26. 실전! OpenLayers6 Sandbox를 내 GeoServer로 구동하기","type":"projects"},"url":"\/2023\/09\/24\/gis-guide-for-programmer-26"},{"body":"","meta":{"category":"React","createdAt":1694955466000,"hasComment":true,"hasPublish":true,"images":["https:\/\/project.itcode.dev\/piedit\/thumb.png"],"subtitle":["일반적으로 사이트에서 글을 작성할 때, HTML 기반의 에디터를 많이 사용한다. 하지만 개발과 관련된 사이트라면, 마크다운 기반의 에디터를 사용하는 것을 심심치않게 볼 수 있다. 내 블로그 또한 웹에서 작성하진 않지만, 마크다운을 기반으로 게시글을 작성하고 있다. 글을 직관적으로 작성할 수 있으면서도, HTML과의 호환이 뛰어나서 웹으로 표현하는데도 무리가 없다. 이를 보조하는 다양한 플러그인은 덤. 블로그 컨텐츠의 미려한 디자인을 위해 렌더링 코드를 추가하여 사용하고 있다. 예를들면, 코드블럭 같은 것들이 그렇다."],"tags":["React","Next.js","Markdown"],"title":"파이딧 개발기","type":"projects"},"url":"\/2023\/09\/17\/piedit"},{"body":"","meta":{"category":"React","createdAt":1694196059000,"hasComment":true,"hasPublish":true,"images":["https:\/\/github.com\/RWB0104\/blog.itcode.dev\/assets\/50317129\/2bb32e45-a33c-4cd2-9ad7-86a36f14abd9"],"subtitle":["블로그 마음에 안 든다고 세 번째 갈아엎은지가 얼마 안 된 거 같은데, 눈 떠보니 어느새 네 차례나 갈아엎고 있는 나를 봤다. 블로그 마지막 글이 거의 반 년 전 글인데, 토이 프로젝트 개발하느라 블로그에 거의 신경을 안 썼다. 더군다나, 3차 개편 이후로 여러 프론트 기술을 습득하게 됐다. 이 때문에 덩달아 내 눈도 높아져버린 탓에, 블로그의 UI가 너무 마음에 들지 않았던 것도 한 몫했다. 다행히 써둔 글들도 꽤 있었고, 그 중엔 나름 효자라 불릴만한 게시글도 몇 개 있어서 방문자가 감소하지는 않았다."],"tags":["React","Next.js","Material UI","Giscus"],"title":"정신차려보니 블로그를 4번이나 갈아 엎은 건에 대하여","type":"projects"},"url":"\/2023\/09\/09\/4th-renewal"},{"body":"","meta":{"category":"React","createdAt":1654872685000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/173095674-228ad2b4-ef60-4c9c-9f2a-78058cde9cf2.png"],"subtitle":["회사에서 할당받은 업무 중 하나로, 컴포넌트를 라이브러리화하여 npm으로 배포하는 업무를 맡게 됐다. 즉, react-bootstrap 같은 컴포넌트 라이브러리를 개발해야한다. 코드 배포 경험이라곤 예전에 JAVA 오픈소스 라이브러리 만든답시고 Maven에 한 번 배포해본 게 전부인 내게, 새로운 개발환경에서의 배포는 필연적인 시행착오를 불러왔다. 개발하면서 느꼈던건, 깊게 참고할만한 레퍼런스가 너무 없었고, 가져다 쓸만한 적절한 코드도 찾지 못 했다. 다행히 뭐 어찌저찌 시간 갈아가며 어느정도 기틀을 잡을 수 있었다. 나름 재밌기도 했고, 한 번 파볼만한 가치도 있는 것 같고, 인지도 높은 레퍼런스도 없는 것 같아서 내가 직접 한 번 만들어보기로 했다."],"tags":["React","Rollup.js","npm","Library"],"title":"Rollup.js로 React 컴포넌트 라이브러리 개발기","type":"projects"},"url":"\/2022\/06\/10\/react-components-library-starter"},{"body":"","meta":{"category":"React","createdAt":1654437679000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/172054319-11955bfc-e4f3-4a30-b8fb-0de34f57c001.png"],"subtitle":["Next.js로 블로그를 다시 만든 뒤에, 새로운 글 작성 이외에 별다른 유지보수는 하지 않았었다. 나름의 이유는 있었던 것이, 일단 당장 쓰는 데 큰 문제가 없었고, 귀찮기도 했다. 적절한 컴포넌트를 구상하고 배치하는 게 여간 귀찮은 일이 아니기도 했고. 내 블로그에 몇 가지 문제점이 있었는데, 그 중 하나가 About 페이지에 아무 것도 없다는 점이다. 뭔가 나름의 블로그 소개를 작성하려고 했는데, 마땅한 아이디어가 없었기 때문. 그러다 문득, 괜찮은 아이디어가 하나 떠올랐는데, \"About 페이지에 커밋 리스트를 표시해주면 괜찮지 않을까?\"란 생각이였다. 나쁘지 않은 생각이였으므로 개발에 들어갔으나, 갑자기 블로그의 못난 부분들이 거슬리기 시작했다. 갑자기 못난 부분들이 보이는 게 너무나도 참을 수 없던 나는, 그렇게 예정에도 없던 블로그 리뉴얼 작업을 시작했다."],"tags":["React","Next.js","개발 블로그"],"title":"블로그 3차 리뉴얼","type":"projects"},"url":"\/2022\/06\/05\/blog-renewal"},{"body":"","meta":{"category":"GIS","createdAt":1654099031000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["WFS 마커는 표현 대상이 많아지면 많아질수록 비용으로 직결된다고 언급한 적이 있었다. 하지만 만약, 정말 만약에, 수 많은 객체를 온전히 마커로 전부 보여줘야 한다면? 어떠한 이유로든 이러한 문제에 당면했을 경우, WebGL이 그 해결책이 될 수 있다. 이 장에서는 WebGL 렌더러를 활용하여 30만개의 마커를 표현해본다."],"tags":["GIS","GeoServer","OpenLayers","WFS","WebGL"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 25. WebGL로 초대용량 데이터 표시하기","type":"projects"},"url":"\/2022\/06\/02\/gis-guide-for-programmer-25"},{"body":"","meta":{"category":"GIS","createdAt":1654097277000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["데이터는 보는 관점에 따라, 전혀 새로운 결과를 도출하기도 한다. 지금까지 다뤘던 지도들은 하나같이 데이터를 지도 상에 있는 그대로 보여주는 것에 중점을 뒀었다. 이번 장에서는 Heat Map을 통해, 데이터를 바라보는 관점을 조금 바꿔본다."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 24. Heat Map 표현하기","type":"projects"},"url":"\/2022\/06\/02\/gis-guide-for-programmer-24"},{"body":"","meta":{"category":"GIS","createdAt":1654019952000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지도에서 마커의 경우, 사용자와의 상호작용이 일어나는 주요소이기 때문에 통상 WFS 객체로 관리한다. 객체를 기반으로 렌더링하다보니, 데이터가 많아지면 많아질수록 곧 서비스의 비용으로 직결된다. 보다시피, 너무 많은 양의 마커는 데이터로써의 의미를 잃게 된다. 너무나도 많은 요소로 인해 시인성은 극도로 떨어지며, 유의미한 상호작용 또한 불가능하다. 최대한 많은 데이터를 보여주고자 흔히 하는 실수이기도 하다. 시인성 이전에, 저렇게 많은 마커를 표현하는 지도는 매우 느리다."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 23. Cluster Map 표현하기","type":"projects"},"url":"\/2022\/06\/01\/gis-guide-for-programmer-23"},{"body":"","meta":{"category":"GIS","createdAt":1653929177000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["세 가지 WFS Transaction API 중, 마지막 단계로 데이터 삭제에 대해 다뤄보자."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 22. WFS Transaction으로 데이터 삭제하기","type":"projects"},"url":"\/2022\/05\/31\/gis-guide-for-programmer-22"},{"body":"","meta":{"category":"GIS","createdAt":1653927012000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["세 가지 WFS Transaction API 중, 데이터를 수정하는 Update에 대해 다뤄보자."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 21. WFS Transaction으로 데이터 수정하기","type":"projects"},"url":"\/2022\/05\/31\/gis-guide-for-programmer-21"},{"body":"","meta":{"category":"GIS","createdAt":1653839746000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지금까지는 GeoServer를 통해 데이터를 호출하고, 이를 표현하는 것이 전부였다. 객체로 표현을 하던, 이미지로 그리던, 데이터를 직접 표현해주던, 결국 어떠한 형태로든 데이터를 보여주는 수준에 그쳤다. 이 문서를 포함하여, 앞으로 서술할 3개 문서는 공간정보 데이터의 삽입\/수정\/삭제에 대해 다룬다. WFS Transaction 프로토콜을 활용하면 정해진 패턴으로 데이터의 CUD를 수행할 수 있다. 이 중 이 문서에서는 WFS Transaction Insert. 즉, 공간정보 데이터의 추가에 대해 다룬다."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 20. WFS Transaction으로 데이터 추가하기","type":"projects"},"url":"\/2022\/05\/30\/gis-guide-for-programmer-20"},{"body":"","meta":{"category":"GIS","createdAt":1653738923000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지도에 표시된 마커 혹은 객체를 클릭하면, 팝업을 통해 해당 객체의 자세한 정보를 보여준다. 이 장에서는 WFS 지도에 팝업을 출력하여 마커의 세부 정보를 표현해본다."],"tags":["GIS","GeoServer","OpenLayers","WMS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 19. WMS에 팝업 붙이기","type":"projects"},"url":"\/2022\/05\/28\/gis-guide-for-programmer-19"},{"body":"","meta":{"category":"GIS","createdAt":1653487206000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지도에 표시된 마커 혹은 객체를 클릭하면, 팝업을 통해 해당 객체의 자세한 정보를 보여준다. 이 장에서는 WFS 지도에 팝업을 출력하여 마커의 세부 정보를 표현해본다."],"tags":["GIS","GeoServer","OpenLayers","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 18. WFS에 팝업 붙이기","type":"projects"},"url":"\/2022\/05\/25\/gis-guide-for-programmer-18"},{"body":"","meta":{"category":"GIS","createdAt":1653069899000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["WFS와 WMS의 가장 큰 특징은 데이터의 결과물이다. WFS는 GeoJSON으로 공간정보 요소를 반환해주는 반면, WMS는 공간정보 요소를 토대로 직접 지도를 렌더링하여 제공해준다. OpenLayers는 WFS의 데이터를 토대로 `canvas`에 객체를 렌더링한다. 공간정보를 토대로 일종의 도형을 그린다고 생각하면 쉽다. 이미지와 다르게 웹 상에서 직접 그려지는 객체이므로, 웹은 이를 인식하거나 조작할 수 있다는 큰 장점이 있다."],"tags":["GIS","GeoServer","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 17. WFS 객체에 상호작용 추가하기","type":"projects"},"url":"\/2022\/05\/21\/gis-guide-for-programmer-17"},{"body":"","meta":{"category":"GIS","createdAt":1652634790000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["이 장에선 WFS를 통해 지도에 이미지를 표시하는 방법에 대해 다룬다. 이전 장의 WFS는 공간정보 데이터를 GeoJSON으로 받아 직접 객체로 표시하지만, WMS는 객체를 GeoServer에서 이미지로 렌더링한 이미지를 받아 표시한다. 즉, GeoServer로 부터 직접 Tile Map을 받아 표현한다고 생각하면 된다."],"tags":["GIS","GeoServer","OpenLayers","OGC","WMS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 16. WMS GetImage를 사용하여 지도에 이미지 표시하기","type":"projects"},"url":"\/2022\/05\/16\/gis-guide-for-programmer-16"},{"body":"","meta":{"category":"GIS","createdAt":1652550530000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지금까지는 온전히 OpenLayers만의 기능이였다면, 이 장부터 슬슬 GeoServer와의 연동을 다루게 된다. 그 중 첫 번째로 다룰 기능은, WFS다. GeoServer에서 WFS는 지정한 요소의 정보를 GeoJSON의 형태로 반환해준다. 이 정보를 적절히 활용하여 지도에 표시할 수 있다. 이러한 기능을 통해 직접 관리하거나 가공한 데이터를 지도에 표시할 수 있다."],"tags":["GIS","GeoServer","OpenLayers","OGC","WFS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 15. WFS GetFeature를 사용하여 지도에 객체 표시하기","type":"projects"},"url":"\/2022\/05\/15\/gis-guide-for-programmer-15"},{"body":"","meta":{"category":"GIS","createdAt":1649004963000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["사용자의 위치를 기반으로 다양한 서비스를 제공할 수 있겠지만, 그 중에서 가장 기본적인 기능은 사용자의 위치를 지도 상에 직접 표시하는 것이다. 이전 장에서 설명한 지오로케이션을 토대로, OpenLayers를 활용하여 위치를 지도에 표시한다."],"tags":["GIS","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 14. 지도에 사용자의 위치 표시하기","type":"projects"},"url":"\/2022\/04\/04\/gis-guide-for-programmer-14"},{"body":"","meta":{"category":"GIS","createdAt":1648921805000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지도 서비스 중에서는 사용자의 위치를 분석하고, 위치에 더욱 적절한 컨텐츠를 제시하기도 한다. 일례로, 배달 어플은 사용자의 위치에 따라 일정 범위 내의 음식점만을 우선으로 보여준다던가 하는 방식이다. 어플리케이션의 경우, 주 구동 기기인 스마트폰의 GPS를 활용할 수 있다. 비슷하게 브라우저는 브라우저 자체적으로 사용자의 동의에 따라 위치정보를 수집하여 활용할 수 있다. 당연하게도 인터넷이 반드시 연결되어야 한다."],"tags":["GIS","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 13. 브라우저에서 사용자 위치정보 수집하기","type":"projects"},"url":"\/2022\/04\/03\/gis-guide-for-programmer-13"},{"body":"","meta":{"category":"GIS","createdAt":1647956241000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["지도를 다루다보면, 내가 현재 보고있는 영역의 좌표, 지도 상에서 마우스가 위치한 좌표, 줌 레벨 등 다양한 정보를 얻어야할 경우가 생긴다. 이런 니즈를 충족하기 위해, 지도 상에 상태창을 만들어 관련 정보를 출력해주면 필요할 때 유용하게 사용할 수 있을 것이다."],"tags":["GIS","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 12. 맵의 유용한 정보 표시하기","type":"projects"},"url":"\/2022\/03\/22\/gis-guide-for-programmer-12"},{"body":"","meta":{"category":"GIS","createdAt":1647874305000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["이전 장에서 OSM을 통해 지도를 표시해봤다. 하지만, OSM의 지도는 디테일함이 떨어진다는 무시할 수 없는 단점이 존재한다. OSM은 사용하기 쉬운 세계지도라는 큰 장점이 있음에도, 저 단점 하나로 인해 국내 서비스용 지도로 사용하기 어렵다. 즉, 예제 이상의 실질적인 서비스에 사용하려면 국내 지리에 특화된 지도가 필요하다."],"tags":["GIS","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 11. VWorld 맵 만들기","type":"projects"},"url":"\/2022\/03\/21\/gis-guide-for-programmer-11"},{"body":"","meta":{"category":"GIS","createdAt":1647287580000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["OSM이란, 전세계 지도 종사자들이 자율적으로 관리하는 세계지도다. 즉, 지도 분야의 오픈 소스라고 생각하면 이해하기 쉽다. 각 국의 기여자들이 지도를 관리하고 있으며, 각 국가의 영역은 해당하는 국가의 언어로 표시된다. 전세계를 대상으로 하는 서비스에도 무리없이 적용 가능하다는 장점이 있다. 단, 한국 기준으로 지도의 퀄리티가 그리 뛰어나진 않다. OpenLayers는 라이브러리 단계에서 OSM을 기본 제공한다. 즉, 별다른 API 호출이나 설정 없이 간단한 코드 몇 줄 만으로도 웹 상에 세계지도를 띄울 수 있다. 이 장에서는 OpenLayers6를 활용하여 웹 상에 OSM을 띄우는 매우 기초적인 방법에 대해 다룬다."],"tags":["GIS","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 10. Open Street Map(OSM) 맵 만들기","type":"projects"},"url":"\/2022\/03\/19\/gis-guide-for-programmer-10"},{"body":"","meta":{"category":"GIS","createdAt":1647274279000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["WFS나 WMS를 호출할 때, 좀 더 다채로운 필터링이 필요한 경우가 존재할 수 있다. 특정 영역 밖의 객체를 호출한다거나, 특정 영역에 걸치는 데이터만 호출하는 것, 혹은 다양한 조건을 조합하여 데이터를 조회해야 할 수도 있다."],"tags":["GIS","GeoServer"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 9. 데이터 필터링하기","type":"projects"},"url":"\/2022\/03\/15\/gis-guide-for-programmer-9"},{"body":"","meta":{"category":"GIS","createdAt":1647268652000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["OpenLayers는 웹 브라우저에서 지도나 GIS 서비스를 제공하기 위한 JavaScript Library다. GIS 라이브러리 중 진입 장벽은 가장 높지만, 그에 상응하는 강력한 기능을 제공한다."],"tags":["GIS","GeoServer"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 8. 공간정보 데이터를 주문하는 법. OGC","type":"projects"},"url":"\/2022\/03\/14\/gis-guide-for-programmer-8"},{"body":"","meta":{"category":"GIS","createdAt":1646583153000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["이전 장에서 공간정보 데이터를 DB에 넣어봤다. 이제 데이터를 적절한 방법으로 통신할 방법만 마련한다면, DB에 저장한 공간정보 데이터를 웹에서든 앱에서든 자유롭게 활용할 수 있을 것이다. 하지만 누누히 언급했듯이, 공간정보 데이터는 다른 데이터와 엄연한 차별점이 존재한다. 바로 공간 데이터라는 점이다. 공간정보 데이터는 일반적인 텍스트 기반의 데이터가 아니다보니, CRUD에 있어서 굉장히 취약하다. 좀 더 자유로운 통신을 위해 DB에 넣었음에도 CRUD에 전혀 강점이 없는 것. 즉, MyBatis든, JPA든, 일반적인 DB 통신으로는 공간정보 데이터를 온전히 받기가 어렵다."],"tags":["GIS","GeoServer"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 7. 공간정보 데이터를 관리하는 법. GeoServer","type":"projects"},"url":"\/2022\/03\/07\/gis-guide-for-programmer-7"},{"body":"","meta":{"category":"GIS","createdAt":1646422541000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["데이터의 CRUD 소요가 있는 서비스는 DB를 사용한다. 서비스 운영에 필요한 데이터를 DB에 저장하고, 이를 적절히 관리, 조작함으로써 서비스의 기능을 제공한다. GIS의 경우, 그 특성상 대용량 데이터를 자주 접하게 된다. 일례로, 전국의 건물 수는 몇백만을 우습게 상회하기 때문. 단순 row가 백만 단위인 것도 문제지만, 건물 정보의 특성 상 column의 갯수 또한 수십 개 정도다. 때문의 데이터의 용량이 매우 커진다."],"tags":["GIS","MariaDB","QGIS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 6. 공간정보의 DB화","type":"projects"},"url":"\/2022\/03\/05\/gis-guide-for-programmer-6"},{"body":"","meta":{"category":"GIS","createdAt":1646419165000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["OpenLayers는 웹 브라우저에서 지도나 GIS 서비스를 제공하기 위한 JavaScript Library다. GIS 라이브러리 중 진입 장벽은 가장 높지만, 그에 상응하는 강력한 기능을 제공한다."],"tags":["GIS","OpenLayers"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 5. OpenLayers","type":"projects"},"url":"\/2022\/03\/05\/gis-guide-for-programmer-5"},{"body":"","meta":{"category":"GIS","createdAt":1646417125000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["이전에 대부분의 공간정보 데이터는 SHP를 기본으로 제공한다고 언급했었다. 그런데 문제는 이 SHP. 어떻게 여는지 모르겠다. GeoJSON이나 CSV 같은 텍스트 기반 데이터는 어찌됐든 열어서 검증을 해볼 수 있지만, SHP는 그게 안 된다는 말이다. 때문에 SHP를 열어서 조작할 수 있는 일종의 툴이 필요한데, 이미 여러 툴이 있으니 크게 문제되진 않는다. 가장 대표적인 툴은 두 가지가 있다."],"tags":["GIS","QGIS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 4. QGIS 체험하기","type":"projects"},"url":"\/2022\/03\/05\/gis-guide-for-programmer-4"},{"body":"","meta":{"category":"GIS","createdAt":1646326049000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["1986년, NASA에서 우주왕복선 챌린저호를 발사했으나, 발사한 지 약 73초만에 폭발한 안타까운 사고가 있었다. 원인은 어이없게도 단위 실수. 국제적인 표준은 미터법임에도 불구하고, 미국을 포함한 몇몇 국가는 인치법을 표준으로 사용하고 있었다. 이러한 상황에서 우주선의 설계도 중 미터법으로 표기된 부품 O Ring을 인치법으로 제작했기 때문에 일어난 사고였다."],"tags":["GIS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 3. 좌표계","type":"projects"},"url":"\/2022\/03\/04\/gis-guide-for-programmer-3"},{"body":"","meta":{"category":"GIS","createdAt":1646318164000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["여러분들이 GIS를 처음 접했다면, 한 번 물어보고 싶다. 공간이란 뭘로 이루어져 있을까? 한 번 생각해보자. 다양한 답이 나왔을 것이라 생각한다. 무슨 답인지 내가 직접 못 듣는다는 게 좀 아쉽지만. 아마 대부분 추상적인 답이 나왔을 것이라 생각한다."],"tags":["GIS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 2. GIS랑 인사하기","type":"projects"},"url":"\/2022\/03\/03\/gis-guide-for-programmer-2"},{"body":"","meta":{"category":"GIS","createdAt":1646316335000,"group":"OpenLayers를 여행하는 개발자를 위한 안내서","hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/156607880-c5abad92-1991-4c01-b85f-7153bf89cb64.png"],"subtitle":["공간정보, 지리쪽에 업이 있거나 관심있는 사람이 아니라면, GIS라는 단어는 다소 생소한 단어다. 혹자는 GIS가 아니라 GPS 아니냐고 반문하기도 한다. GPS(Global Positioning System)는 3개 이상의 위성 신호를 통해 수신기의 위치를 계산할 수 있는 기법이다. GPS라 하면 흔히 네비게이션을 연상하기 쉽지만, 알게 모르게 GPS는 일상생활에 깊게 녹아들어 있다. 네비게이션, 스마트폰 지도, 배달 플랫폼의 라이더 위치 추적, 드론 군집비행, 군사학 등. GPS는 다양한 영역에 스며들어 그 이로움을 전해준다. 우리는 GPS를 통해, 공간정보라는 디지털 시대에서 공간을 디지털화한다는 것이 어떤 능력을 발휘하는 지 엿볼 수 있다. GIS(Global Information System)는 GPS와 같이 공간정보를 다루는 모든 기술에 대한 포괄적인 기술을 의미한다. GPS 뿐만 아니라, 지도, 좌표계와 같이 공간과 엮이는 모든 기술은 GIS라는 커다란 범주로 묶을 수 있다."],"tags":["GIS"],"title":"OpenLayers를 여행하는 개발자를 위한 안내서 - 1. 머릿말","type":"projects"},"url":"\/2022\/03\/03\/gis-guide-for-programmer-1"},{"body":"","meta":{"category":"React","createdAt":1635183450000,"hasComment":true,"hasPublish":true,"images":["https:\/\/user-images.githubusercontent.com\/50317129\/138741601-2bca31f3-d08a-4789-9c99-6a835883fbe4.png"],"subtitle":["어쩌다 독학하게 된 React를 유의미하게 써먹기위해 직접 만든 개발 블로그. 정적 블로그를 위한 NextJS를 활용하여 개발했다. Typescript를 사용하고 있으며, SCSS를 통한 CSS-in-CSS 방식으로 디자인을 렌더링한다. 라즈베리파이를 구매하면서 서버 구축을 위해 같이 구입한 도메인 itcode.dev를 적용했다. blog.itcode.dev로, 서브도메인 blog를 사용했다."],"tags":["NextJS","React","Typescript","SCSS"],"title":"[React] 𝝅번째 알파카의 개발 낙서장 프로젝트","type":"projects"},"url":"\/2021\/10\/26\/github-react-blog"}]}</script>
